// ── Registrar contacto (un solo flujo para llamadas, WhatsApp, videollamadas y visitas) ──
const MEDIOS = {
  llamada:     {t:'Llamada',     res:[['contesto','Contestó'],['no_contesto','No contestó'],['asesoria','Agendó asesoría'],['cita','Agendó cita en agencia']]},
  whatsapp:    {t:'WhatsApp',    res:[['mensaje','Le escribí'],['respondio','Me respondió'],['asesoria','Agendó asesoría'],['cita','Agendó cita en agencia']]},
  videollamada:{t:'Asesoría / videollamada', res:[['realizada','Se hizo'],['no_conecto','No se conectó'],['cita','Agendó cita en agencia']]},
  agencia:     {t:'En agencia',  res:[['asistio','Vino a la agencia'],['no_asistio','No llegó']]},
};
function nuevoReg(pre){ return {medio: (pre && pre.medio) || 'llamada', res: (pre && pre.res) || '', paso:'', fecha:'', cita:''}; }
// Cambia medio/resultado sin perder lo que ya se escribió
function regSet(k, v){
  if ($('reg-txt')) REG.paso = $('reg-txt').value;
  if ($('reg-fecha')) REG.fecha = $('reg-fecha').value;
  if ($('reg-cita')) REG.cita = $('reg-cita').value;
  REG[k] = v; if (k === 'medio') REG.res = '';
  renderFicha();
}
function regHTML(l){
  const m = MEDIOS[REG.medio];
  const necesitaCita = REG.res === 'cita';
  return `<div class="reg" id="reg-box">
    <div class="h2" style="font-size:16px;margin-bottom:10px">Registrar contacto</div>
    <div class="reg-l">¿Por dónde?</div>
    <div class="opts">${Object.entries(MEDIOS).map(([k,v])=>`<button class="opt ${REG.medio===k?'on':''}" onclick="regSet('medio','${k}')">${v.t}</button>`).join('')}</div>
    <div class="reg-l">¿Qué pasó?</div>
    <div class="opts">${m.res.map(([k,t])=>`<button class="opt ${REG.res===k?'on':''}" onclick="regSet('res','${k}')">${t}</button>`).join('')}</div>
    ${necesitaCita ? `<div class="reg-l">Fecha y hora de la cita</div><input class="inp" type="datetime-local" id="reg-cita" value="${esc(REG.cita)}" onchange="REG.cita=this.value">` : ''}
    ${pasoFormHTML('reg', REG.paso || (necesitaCita?'Confirmar cita':REG.res==='asesoria'?'Hacer asesoría':REG.res==='no_contesto'?'Llamar de nuevo':''), REG.fecha)}
    <div class="reg-foot"><button class="btn btn-ghost" onclick="REG=null;renderFicha()">Cancelar</button><button class="btn btn-primary" onclick="guardarRegistro()">Guardar</button></div>
  </div>`;
}
function guardarRegistro(){
  const l = BYID[fichaId], s = S(l);
  if (!REG.res) { toast('Elige qué pasó.'); return; }
  const paso = $('reg-txt').value.trim(), fecha = $('reg-fecha').value;
  const cita = REG.res === 'cita' ? ($('reg-cita')?.value || '') : '';
  if (REG.res === 'cita' && !cita) { toast('Pon la fecha de la cita.'); return; }
  if (!paso || !fecha) { toast('Define el siguiente paso y su fecha: ningún lead activo se queda sin plan.'); return; }
  const c = {taskText: paso, taskDate: fecha, ultimoContacto: isoHora(new Date())};
  if (!s.primerContacto) c.primerContacto = isoHora(new Date());
  const inc = k => c[k] = (s[k]||0) + 1;
  const r = REG.res, m = REG.medio;
  if (m==='llamada' && r==='no_contesto') inc('intentos');
  else if (m==='llamada') inc('llamadasRealizadas');
  // Un WhatsApp sin respuesta cuenta como intento; solo cuenta como contacto cuando la persona responde
  if (m==='whatsapp' && r==='mensaje') inc('intentos');
  else if (m==='whatsapp') inc('mensajesSeguimiento');
  if (m==='videollamada' && r==='realizada') { inc('videollamadasRealizadas'); c.asistioReunion = 'Sí'; }
  if (m==='videollamada' && r==='no_conecto') c.asistioReunion = 'No';
  if (r==='asesoria') inc('videollamadasAgendadas');
  if (r==='cita') { inc('citaAgenciaAgendada'); c.citaAgenciaFecha = cita; }
  if (r==='asistio') c.asistioReunion = 'Sí';
  if (r==='no_asistio') c.asistioReunion = 'No';
  if (/^llamar/i.test(paso)) inc('llamadasAgendadas');
  // La etapa solo avanza, nunca retrocede sola
  const destino = {contesto:'contactado', respondio:'contactado', asesoria:'asesoria', realizada:'seguimiento', cita:'cierre', asistio:'cierre'}[r];
  const e = etapa(l);
  if (destino && ETAPA_IDX[destino] > ETAPA_IDX[e] && e !== 'perdido') c.etapa = destino;
  const resTxt = MEDIOS[m].res.find(x => x[0]===r)[1];
  const log = `${MEDIOS[m].t}: ${resTxt}${cita?' ('+cuando(cita)+')':''}${c.etapa?` · pasa a ${ETAPAS[ETAPA_IDX[c.etapa]].label}`:''} → ${paso}, ${cuando(fecha)}`;
  guardar(l.id, c, {log, k:'c'});
  REG = null;
  toast('Contacto registrado');
  renderFicha();
}

// ── Etapa / perdido / cierre ──
function setEtapa(id){
  const l = BYID[fichaId]; const antes = etapa(l);
  if (id === antes) return;
  const c = {etapa:id};
  if (id === 'cerrado') { c.fechaCierre = isoHora(new Date()); c.taskText=''; c.taskDate=''; }
  if (antes === 'perdido') c.motivoPerdida = '';
  if (antes === 'nuevo' && !S(l).primerContacto && id !== 'perdido') c.primerContacto = isoHora(new Date());
  guardar(l.id, c, {log:`Etapa: ${ETAPAS[ETAPA_IDX[antes]].label} → ${ETAPAS[ETAPA_IDX[id]].label}`, k:'e'});
  if (id === 'cerrado') celebrar(l.nombre);
  renderFicha();
}
function pedirPerdido(){
  openModal(`<div class="h2">¿Por qué se perdió?</div><p class="hint" style="margin-bottom:14px">Esto le dice al equipo y a contenido qué está frenando las ventas.</p>
    <div class="opts" style="flex-direction:column;align-items:stretch">${MOTIVOS_PERDIDA.map(m=>`<button class="opt" style="text-align:left;height:auto;padding:10px 13px" onclick="marcarPerdido('${esc(m)}')">${m}</button>`).join('')}</div>
    <div class="reg-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button></div>`);
}
function marcarPerdido(motivo){
  const l = BYID[fichaId]; const antes = etapa(l);
  guardar(l.id, {etapa:'perdido', motivoPerdida: motivo, taskText:'', taskDate:''}, {log:`Perdido (${motivo}) — estaba en ${ETAPAS[ETAPA_IDX[antes]].label}`, k:'e'});
  closeModal(); renderFicha(); toast('Marcado como perdido');
}
function celebrar(nombre){

  d.innerHTML = `<div><div style="font-size:40px">🎉</div><b>¡Venta cerrada!</b><div class="hint">${esc(nombre)}</div></div>`;

}

function gcalLink(iso, l){
  const d = fromISO(iso); if (!d) return '';
  const fin = new Date(d.getTime() + 60*60000);
  const z = x => `${x.getUTCFullYear()}${pad(x.getUTCMonth()+1)}${pad(x.getUTCDate())}T${pad(x.getUTCHours())}${pad(x.getUTCMinutes())}00Z`;
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent('Cita Geely Serdán — ' + l.nombre) + '&dates=' + z(d) + '/' + z(fin) + '&location=' + encodeURIComponent(AGENCIA_DIR) + '&details=' + encodeURIComponent(`Cita para revisar tu ${l.modelo || 'Geely'}.`);
}
function plantillas(l){
  const n = firstName(l.nombre), yo = firstName(currentUser.nombre), mod = l.modeloCorto !== '—' ? l.modeloCorto : 'tu Geely';
  const s = S(l);
  const faltan = DOCS.slice(0,3).filter(d => !s[d.key]).map(d => d.label.toLowerCase());
  const out = [
    {k:'primer', t:'Primer contacto', m:`Hola ${n}, soy ${yo}, asesor de Geely Serdán. Vi que hiciste el test y te recomendó el ${mod}. Te escribo para resolver tus dudas, sin compromiso: ¿qué es lo que más te importa en tu próximo auto?`},
    {k:'asesoria', t:'Invitar a la asesoría', m:`Hola ${n}, para armarte un plan a tu medida (enganche, mensualidad y tiempos) te propongo una videollamada de 20 minutos. ¿Te acomoda hoy o mañana? Tú dime la hora.`},
    {k:'seguimiento', t:'Seguimiento', m:`Hola ${n}, ¿cómo vas? Me quedé pendiente de lo que platicamos del ${mod}. ¿Hay algo que te esté frenando y que te pueda aclarar?`},
  ];
  if (faltan.length) out.push({k:'docs', t:'Pedir documentos', m:`Hola ${n}, para avanzar con tu solicitud solo me falta${faltan.length>1?'n':''}: ${faltan.join(', ')}. Me los puedes mandar por aquí en foto.`});
  if (s.citaAgenciaFecha) out.push({k:'cita', t:'Confirmar cita', m:`Hola ${n}, te confirmo tu cita en Geely Serdán ${cuando(s.citaAgenciaFecha)}.\n\n📍 ${AGENCIA_DIR}\n\nAgrégala a tu calendario aquí:\n${gcalLink(s.citaAgenciaFecha, l)}\n\nCualquier cosa me escribes por aquí.`});
  out.push({k:'reactivar', t:'Reactivar', m:`Hola ${n}, hace unos días hiciste el test del ${mod}. ¿Sigues buscando auto? Si quieres, te comparto cómo quedaría tu mensualidad con las condiciones de este mes.`});
  return out;
}
function abrirPlantillas(id){
  const l = BYID[id];
  if (!telLimpio(l)) { toast('Este lead no tiene teléfono válido.'); return; }
  const ps = plantillas(l);
  const sug = etapa(l) === 'nuevo' ? 'primer' : etapa(l) === 'contactado' ? 'asesoria' : S(l).citaAgenciaFecha && activo(l) ? 'cita' : 'seguimiento';
  window._pl = {id, ps};
  openModal(`<div class="h2">WhatsApp a ${esc(firstName(l.nombre))}</div><p class="hint" style="margin-bottom:12px">Elige un mensaje. Lo puedes editar antes de mandarlo.</p>
    <div class="opts" style="margin-bottom:10px">${ps.map((p,i)=>`<button class="opt ${p.k===sug?'on':''}" onclick="document.querySelectorAll('#modal .opts .opt').forEach(o=>o.classList.remove('on'));this.classList.add('on');$('wa-msg').value=window._pl.ps[${i}].m">${p.t}</button>`).join('')}</div>
    <textarea class="inp" id="wa-msg" style="min-height:150px">${esc((ps.find(p=>p.k===sug)||ps[0]).m)}</textarea>
    <div class="reg-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-wa" onclick="mandarWA()">${IC.wa} Abrir WhatsApp</button></div>`);
}
function mandarWA(){
  const {id} = window._pl; const l = BYID[id];
  window.open(`https://wa.me/${telLimpio(l)}?text=${encodeURIComponent($('wa-msg').value)}`, '_blank');
  closeModal();
  // Al volver, pedir el registro con WhatsApp ya elegido
  if (fichaId !== id) openFicha(id, {medio:'whatsapp', res:'mensaje'});
  else { REG = nuevoReg({medio:'whatsapp', res:'mensaje'}); renderFicha(); }
}
function enviarConfirmacionCita(){
  const l = BYID[fichaId]; const s = S(l);
  const msg = plantillas(l).find(p => p.k==='cita').m;
  window.open(`https://wa.me/${telLimpio(l)}?text=${encodeURIComponent(msg)}`, '_blank');
  guardar(l.id, {confirmaciones:(s.confirmaciones||0)+1, ultimoContacto: isoHora(new Date())}, {log:'Confirmación de cita enviada por WhatsApp', k:'c'});
  renderFicha();
}

// ── Modal genérico ──
function openModal(html){ $('modal').innerHTML = html; $('modal-ov').classList.add('open'); setTimeout(()=>$('modal').querySelector('button,textarea,input')?.focus(), 30); }
function closeModal(){ $('modal-ov').classList.remove('open'); }

// ── Editar nombres del equipo (admin) ──
function openTeamPanel(){
  openModal(`<div class="h2">Editar equipo</div><p class="hint" style="margin-bottom:14px">Cambia cómo aparece el nombre de cada quien. Usuario y contraseña no cambian.</p>
    ${USERS.map(u=>`<label class="field"><span>${u.user}${u.role!=='asesor'?' ('+(u.role==='admin'?'líder':'contenido')+')':''}</span><input class="inp" id="tn-${u.user}" value="${esc(u.nombre)}"></label>`).join('')}
    <div class="reg-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveTeamNames()">Guardar cambios</button></div>`);
}
function saveTeamNames(){
  let n = 0;
  USERS.forEach(u => { const v = $('tn-'+u.user)?.value.trim(); if (v && v !== u.nombre) { u.nombre = v; n++; enviar({tipo:'usuario', userId:u.user, nombre:v}); } });
  closeModal(); toast(n ? `${plural(n,'nombre')} actualizado${n===1?'':'s'}` : 'Sin cambios');
  $('me-name').textContent = currentUser.nombre; render();
}
</script>
<script>
// ══════════════════════════════════════════════════════════════
// PERIODOS
// ══════════════════════════════════════════════════════════════
let PERIODO = 'mes';
const PERIODOS = [['mes','Este mes'],['mes_ant','Mes pasado'],['90d','90 días'],['todo','Todo']];
function rango(p){
  const n = new Date();
  if (p === 'mes')     return {a:new Date(n.getFullYear(),n.getMonth(),1), b:null, txt:'este mes'};
  if (p === 'mes_ant') return {a:new Date(n.getFullYear(),n.getMonth()-1,1), b:new Date(n.getFullYear(),n.getMonth(),1), txt:'el mes pasado'};
  if (p === '90d')     return {a:addDias(hoy0(),-89), b:null, txt:'los últimos 90 días'};
  return {a:null, b:null, txt:'todo el historial'};
}
// Periodo anterior comparable (para "este mes" compara contra los mismos días del mes pasado)
function rangoPrevio(p){
  const n = new Date();
  if (p === 'mes') { const a = new Date(n.getFullYear(),n.getMonth()-1,1); return {a, b:addDias(a, n.getDate()), txt:'mismos días del mes pasado'}; }
  if (p === 'mes_ant') return {a:new Date(n.getFullYear(),n.getMonth()-2,1), b:new Date(n.getFullYear(),n.getMonth()-1,1), txt:'el mes anterior'};
  if (p === '90d') return {a:addDias(hoy0(),-179), b:addDias(hoy0(),-89), txt:'los 90 días previos'};
  return null;
}
const enRango = (d, r) => !!d && (!r.a || d >= r.a) && (!r.b || d < r.b);
const segPeriodo = () => `<div class="seg">${PERIODOS.map(([k,t])=>`<button class="${PERIODO===k?'on':''}" onclick="PERIODO='${k}';render()">${t}</button>`).join('')}</div>`;
function deltaHTML(act, prev, r){ if (prev == null || !r) return ''; if (!prev) return act ? `<span class="delta-up">nuevo</span> vs ${r.txt}` : ''; const d = Math.round((act-prev)/prev*100); return `<span class="${d>=0?'delta-up':'delta-down'}">${d>=0?'▲':'▼'} ${Math.abs(d)}%</span> vs ${r.txt}`; }

// Fecha de cierre (si no se registró, se aproxima con el último contacto)
function fechaCierreDe(l){ const s = S(l); return fromISO(s.fechaCierre) || (etapa(l)==='cerrado' ? (fromISO(s.ultimoContacto) || null) : null); }

// ── Gráficas sencillas ──
function barras(rows, opt={}){
  const max = Math.max(1, ...rows.map(r => r.v));
  return `<div class="bars">${rows.map(r => `<div class="bar-row" data-tip="${esc(r.tip || `${r.l}: ${r.v}`)}">
    <span class="lbl" title="${esc(r.l)}">${esc(r.l)}</span>
    <span class="track"><span class="fill ${r.cls||opt.cls||''}" style="width:${Math.max(r.v/max*100, r.v?2:0)}%"></span></span>
    <span class="val">${r.v}${r.s!=null?` <small>${r.s}</small>`:''}</span></div>`).join('') || '<div class="empty">Sin datos todavía</div>'}</div>`;
}
function columnas(cols, series){
  // cols: [{l, vals:[...], tip}] · series: [{n, c}] → barras apiladas con 2px de separación
  const max = Math.max(1, ...cols.map(c => c.vals.reduce((a,b)=>a+b,0)));
  return `<div class="cols" style="grid-template-columns:repeat(${cols.length},1fr)">${cols.map(c => {
    const tot = c.vals.reduce((a,b)=>a+b,0);
    return `<div class="cc" data-tip="${esc(c.tip || c.l)}"><span class="cv">${tot}</span><div class="stackbar" style="flex:0 0 ${Math.max(tot/max*120, tot?3:0)}px">${c.vals.map((v,i)=> v ? `<i style="flex:${v};background:${series[i].c}"></i>` : '').join('')}</div><span class="cl">${esc(c.l)}</span></div>`;
  }).join('')}</div>${series.length > 1 ? `<div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')}</div>` : ''}`;
}
function ultimosMeses(n){ const out = []; const d = new Date(); for (let i=n-1;i>=0;i--) out.push(mesKey(new Date(d.getFullYear(), d.getMonth()-i, 1))); return out; }

// ══════════════════════════════════════════════════════════════
// PANTALLA: PANEL (líder)
// ══════════════════════════════════════════════════════════════
function embudo(leads){
  const pasos = [
    ['Llegaron', l => true],
    ['Asignados', l => !!S(l).asignado],
    ['Contactados', l => contactado(l)],
    ['Asesoría', l => nivelCiclo(l) >= 2 || S(l).videollamadasAgendadas > 0],
    ['Crédito en trámite', l => ['en_proceso','aprobada'].includes(S(l).creditoEstado) || nivelCiclo(l) >= 4],
    ['Cita en agencia', l => S(l).citaAgenciaAgendada > 0 || nivelCiclo(l) >= 4],
    ['Cerrados', l => etapa(l) === 'cerrado'],
  ];
  return pasos.map(([t, f]) => ({t, n: leads.filter(f).length}));
}
function embudoHTML(steps){
  const top = steps[0].n || 1;
  let peor = -1, peorPct = 101;
  steps.forEach((s,i) => { if (i>0 && steps[i-1].n >= 5) { const p = steps[i-1].n ? s.n/steps[i-1].n*100 : 100; if (p < peorPct) { peorPct = p; peor = i; } } });
  let h = '<div class="funnel">';
  steps.forEach((s,i) => {
    if (i > 0) { const p = steps[i-1].n ? Math.round(s.n/steps[i-1].n*100) : 0; h += `<div class="fn-drop ${i===peor?'worst':''}">↓ ${p}% pasa${i===peor?' · aquí se cae más gente':''}</div>`; }
    h += `<div class="fn-row" data-tip="${esc(`${s.t}: ${s.n} (${pct(s.n,top)}% de los que llegaron)`)}"><span class="fn-lbl">${s.t}</span><span><span class="fn-bar" style="display:block;width:${Math.max(s.n/top*100, s.n?1.5:0)}%"></span></span><span class="fn-val">${s.n}<small>${pct(s.n,top)}%</small></span></div>`;
  });
  return h + '</div>';
}

function renderPanel(){
  const el = $('s-panel');
  const r = rango(PERIODO), rp = rangoPrevio(PERIODO);
  setTitulo('Panel', `Cómo va la operación · ${r.txt}`, segPeriodo());
  const reales = LEADS.filter(l => !l.test);
  const enPer  = reales.filter(l => enRango(l.dt, r));
  const locales = enPer.filter(l => l.local);
  const prevLoc = rp ? reales.filter(l => l.local && enRango(l.dt, rp)).length : null;
  const asign = locales.filter(l => S(l).asignado);
  const contact = asign.filter(contactado);
  const tiempos = locales.map(tiempoPrimerContacto).filter(x => x != null);
  const cierres = reales.filter(l => etapa(l)==='cerrado' && enRango(fechaCierreDe(l), r));
  const cierresPrev = rp ? reales.filter(l => etapa(l)==='cerrado' && enRango(fechaCierreDe(l), rp)).length : null;

  let html = '';

  // ── Atención ahora ──
  if (!esContenido()) {
    const activosLoc = reales.filter(l => l.local && activo(l));
    const sinA = activosLoc.filter(l => !S(l).asignado);
    const sinTocar = reales.filter(l => S(l).asignado && activo(l) && etapa(l)==='nuevo' && !tocado(l) && horasDesde(refAsignacion(l)) > HORAS_PRIMER_CONTACTO);
    const porAse = {}; sinTocar.forEach(l => { const n = nombreAsesor(S(l).asignado); porAse[n] = (porAse[n]||0)+1; });
    const venc = reales.filter(l => activo(l) && siguientePaso(l)?.estado === 'vencido');
    const citas = reales.filter(l => activo(l) && (()=>{ const c = citaInfo(l); return c && c.dd >= 0 && c.dd <= 2; })());
    const sinPlan = reales.filter(l => activo(l) && contactado(l) && !siguientePaso(l));
    const alerts = [
      [sinA.length, 'Leads locales sin asignar', 'Cada hora sin asesor baja la probabilidad de que contesten.', `irLeads({sinAsignar:true})`, 'Asignar', 'bad'],
      [sinTocar.length, `Asignados hace más de ${HORAS_PRIMER_CONTACTO} h sin primer contacto`, Object.entries(porAse).sort((a,b)=>b[1]-a[1]).map(([n,c])=>`${n} (${c})`).join(', ') || 'Nadie', `irLeads({cola:'primer'})`, 'Ver', 'bad'],
      [venc.length, 'Pasos vencidos', 'Seguimientos que se quedaron sin hacer.', `irLeads({cola:'vencido'})`, 'Ver', 'warn'],
      [sinPlan.length, 'Contactados sin siguiente paso', 'Ya hubo plática pero nadie agendó qué sigue.', `irLeads({sinPlan:true})`, 'Ver', 'warn'],
      [citas.length, 'Citas en agencia en los próximos 2 días', 'Asegúrate de que se confirmen.', `irLeads({cola:'cita'})`, 'Ver', 'good'],
    ];
    html += `<div class="block"><div class="h2-row"><div class="h2">Atención ahora</div><span class="hint">Se actualiza solo</span></div><div class="alerts">${alerts.map(([n,t,d,fn,b,tone]) => `<div class="alert">
      <span class="big" style="color:${n?`var(--${tone})`:'var(--ink-3)'}">${n}</span>
      <div style="min-width:0"><div class="t">${t}</div><div class="d">${esc(d)}</div></div>
      ${n ? `<button class="btn btn-sm" onclick="${fn}">${b}</button>` : '<span class="chip good">Al día</span>'}</div>`).join('')}</div></div>`;
  }

  // ── Indicadores del periodo ──
  html += `<div class="tiles" style="margin-top:16px">
    <div class="tile"><div class="tile-l">Leads de zona local</div><div class="tile-v num">${locales.length}</div><div class="tile-s">${pct(locales.length, enPer.length)}% de ${enPer.length} totales${prevLoc!=null?'<br>'+deltaHTML(locales.length, prevLoc, rp):''}</div></div>
    <div class="tile"><div class="tile-l">Contactados</div><div class="tile-v num">${pct(contact.length, asign.length)}%</div><div class="tile-s">${contact.length} de ${asign.length} asignados</div></div>
    <div class="tile"><div class="tile-l">Tiempo al primer contacto</div><div class="tile-v num">${horasTexto(mediana(tiempos))}</div><div class="tile-s">${tiempos.length ? `mediana de ${plural(tiempos.length,'lead')}` : 'Se empieza a medir con los registros nuevos'}</div></div>
    <div class="tile"><div class="tile-l">Ventas cerradas</div><div class="tile-v num" style="color:var(--good)">${cierres.length}</div><div class="tile-s">${cierresPrev!=null?deltaHTML(cierres.length, cierresPrev, rp):'en todo el historial'}</div></div>
  </div>`;

  // ── Embudo + resultados por mes ──
  const meses = ultimosMeses(6);
  const porMes = meses.map(m => ({m, loc: reales.filter(l => l.local && l.mes === m).length, cie: reales.filter(l => mesKey(fechaCierreDe(l)) === m).length}));
  html += `<div class="grid-12" style="margin-top:16px">
    <div class="block"><div class="h2-row"><div class="h2">Embudo de zona local</div><span class="hint">Leads que llegaron ${r.txt}</span></div>
      ${locales.length ? embudoHTML(embudo(locales)) : '<div class="empty">No llegaron leads locales en este periodo.</div>'}</div>
    <div class="block"><div class="h2">Resultados por mes</div><p class="hint" style="margin:4px 0 6px">Leads locales que llegaron cada mes</p>
      ${columnas(porMes.map(x => ({l: mesLabel(x.m), vals:[x.loc], tip:`${mesLabel(x.m,true)}: ${x.loc} leads locales`})), [{n:'Leads locales', c:'var(--s1)'}])}
      <p class="hint" style="margin:16px 0 6px">Ventas cerradas en cada mes</p>
      ${columnas(porMes.map(x => ({l: mesLabel(x.m), vals:[x.cie], tip:`${mesLabel(x.m,true)}: ${x.cie} ventas`})), [{n:'Cierres', c:'var(--good)'}])}
    </div>
  </div>`;

  // ── Prospectos por mes y perfil ──
  const mesesT = ultimosMeses(6).reverse();
  const filasT = [];
  mesesT.forEach(m => {
    const delMes = reales.filter(l => l.local && l.mes === m);
    if (!delMes.length) return;
    const perfiles = ['S','A','B','C','—'].filter(p => delMes.some(l => l.perfil === p));
    perfiles.forEach((p, i) => {
      const g = delMes.filter(l => l.perfil === p);
      const a = g.filter(l => S(l).asignado).length;
      filasT.push(`<tr style="cursor:default">${i===0?`<td rowspan="${perfiles.length}" style="font-weight:600;vertical-align:top;white-space:nowrap">${mesLabel(m,true)}</td>`:''}
        <td class="c">${pfHTML(p)}</td><td class="r num">${g.length}</td><td class="r num">${a}</td>
        <td class="r num ${g.length-a?'soon':''}">${g.length-a}</td><td class="r num">${g.filter(contactado).length}</td>
        <td class="r num">${g.filter(l=>nivelCiclo(l)>=2).length}</td><td class="r num" style="${g.filter(l=>etapa(l)==='cerrado').length?'color:var(--good);font-weight:700':''}">${g.filter(l=>etapa(l)==='cerrado').length}</td></tr>`);
    });
  });
  html += `<div class="block" style="margin-top:16px"><div class="h2-row"><div class="h2">Prospectos por mes y perfil</div><span class="hint">Solo zona local · fuera de zona no se asigna</span></div>
    <div style="overflow-x:auto"><table class="tbl" style="min-width:620px"><thead><tr><th>Mes</th><th class="c">Perfil</th><th class="r">Llegaron</th><th class="r">Asignados</th><th class="r">Sin asignar</th><th class="r">Contactados</th><th class="r">Asesoría o más</th><th class="r">Cerrados</th></tr></thead>
    <tbody>${filasT.join('') || '<tr><td colspan="8" class="empty">Sin datos</td></tr>'}</tbody></table></div></div>`;

  // ── Pérdidas + perfil por zona ──
  const perdidos = enPer.filter(l => etapa(l)==='perdido');
  const motivos = {}; perdidos.forEach(l => { const m = S(l).motivoPerdida || 'Sin motivo registrado'; motivos[m] = (motivos[m]||0)+1; });
  const zonas = ['S','A','B','C'].map(p => ({p, loc: enPer.filter(l=>l.local&&l.perfil===p).length, fue: enPer.filter(l=>!l.local&&l.perfil===p).length}));
  const totLoc = zonas.reduce((a,z)=>a+z.loc,0), totFue = zonas.reduce((a,z)=>a+z.fue,0);
  html += `<div class="grid2" style="margin-top:16px">
    <div class="block"><div class="h2-row"><div class="h2">Por qué se pierden</div><span class="hint">${plural(perdidos.length,'perdido')} ${r.txt}</span></div>
      ${perdidos.length ? barras(Object.entries(motivos).sort((a,b)=>b[1]-a[1]).map(([l,v]) => ({l, v, s:`${pct(v,perdidos.length)}%`, cls: l==='Sin motivo registrado'?'dim':''}))) : '<div class="empty">Sin perdidos en este periodo.</div>'}
    </div>
    <div class="block"><div class="h2-row"><div class="h2">Calidad del perfil por zona</div><span class="hint">% dentro de cada zona</span></div>
      ${barras(zonas.map(z => ({l:`Perfil ${z.p} · local`, v:z.loc, s:`${pct(z.loc,totLoc)}%`, cls:'emph'})).concat(zonas.map(z => ({l:`Perfil ${z.p} · fuera`, v:z.fue, s:`${pct(z.fue,totFue)}%`, cls:'dim'}))))}
    </div>
  </div>`;

  // ── Pronóstico ──
  if (!esContenido()) {
    const mesAct = mesKey(new Date());
    const prox = reales.filter(l => activo(l) && mesKey(fromISO(S(l).fechaObjetivoCierre)) === mesAct).sort((a,b) => fromISO(S(a).fechaObjetivoCierre) - fromISO(S(b).fechaObjetivoCierre));
    html += `<div class="block" style="margin-top:16px"><div class="h2-row"><div class="h2">Podrían cerrar este mes</div><span class="hint">Leads activos con fecha objetivo en ${MESES_L[new Date().getMonth()]}</span></div>
      ${prox.length ? `<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Prospecto</th><th>Asesor</th><th>Ciclo</th><th>Crédito</th><th>Fecha objetivo</th></tr></thead><tbody>${prox.map(l=>`<tr onclick="openFicha(${l.id})"><td><div class="cell-name">${pfHTML(l.perfil)} ${esc(l.nombre)}</div></td><td>${esc(nombreAsesor(S(l).asignado)||'—')}</td><td>${laneHTML(l)}</td><td>${esc((CREDITO.find(c=>c.id===(S(l).creditoEstado||'no_iniciada'))||{}).label||'')}</td><td>${cuando(S(l).fechaObjetivoCierre)}</td></tr>`).join('')}</tbody></table></div>`
        : '<div class="empty">Nadie tiene fecha objetivo de cierre este mes. Los asesores la ponen en la ficha, en "Documentos y crédito".</div>'}</div>`;
  }
  el.innerHTML = html;
}

// ══════════════════════════════════════════════════════════════
// PANTALLA: EQUIPO (líder)
// ══════════════════════════════════════════════════════════════
function renderEquipo(){
  const el = $('s-equipo');
  setTitulo('Equipo', 'Cómo trabaja cada asesor');
  const {stats} = computeTeamStats();
  const tot = k => stats.reduce((a,s)=>a+(s[k]||0),0);
  const pcs = stats.map(s=>s.medianaPC).filter(x=>x!=null);
  const fila = s => `<tr onclick="irLeads({asesor:'${s.u.user}',zona:'todas'})">
    <td><div class="cell-name"><span class="avatar" style="width:28px;height:28px;font-size:12px">${esc(s.u.nombre.charAt(0))}</span>${esc(s.u.nombre)}</div></td>
    <td class="r num">${s.activos}</td>
    <td class="r num ${s.sinTocar24?'late':s.sinTocar?'soon':''}">${s.sinTocar}${s.sinTocar24?` <small>(${s.sinTocar24} > ${HORAS_PRIMER_CONTACTO} h)</small>`:''}</td>
    <td class="r num">${horasTexto(s.medianaPC)}</td>
    <td class="r num">${s.contactos7}</td>
    <td class="r num ${s.vencidos?'late':''}">${s.vencidos}</td>
    <td class="r num">${s.enProceso}</td>
    <td class="r num">${s.citas}</td>
    <td class="r num" style="${s.cerradosMes?'color:var(--good);font-weight:700':''}">${s.cerradosMes} <small class="hint">/ ${s.cerrados}</small></td>
    <td class="r num">${s.tasa}%</td></tr>`;
  el.innerHTML = `
    <div class="block">
      <div class="h2-row"><div class="h2">Seguimiento por asesor</div><span class="hint">Toca un asesor para ver sus leads</span></div>
      <div style="overflow-x:auto"><table class="tbl" style="min-width:860px"><thead><tr>

let rkPeriodo = 'todo', rkAbierto = new Set();
function guardarSnapshotRanking(stats){
  let h = {}; try { h = JSON.parse(localStorage.getItem('ranking_historial') || '{}'); } catch {}
  h[isoDia(new Date())] = stats.map(s => ({user:s.u.user, puntos:s.puntos, cerrados:s.cerrados}));
  const k = Object.keys(h).sort(); while (k.length > 60) delete h[k.shift()];
  try { localStorage.setItem('ranking_historial', JSON.stringify(h)); } catch {}
}
function snapshotHace(n){
  let h = {}; try { h = JSON.parse(localStorage.getItem('ranking_historial') || '{}'); } catch {}
  const obj = isoDia(addDias(new Date(), -n));
  const k = Object.keys(h).sort().filter(x => x <= obj);
  return k.length ? {fecha:k[k.length-1], datos:h[k[k.length-1]]} : null;
}
function renderRanking(){
  const el = $('s-ranking');
  setTitulo('Ranking', 'Cierres, seguimiento y asistencia', `<div class="seg"><button class="${rkPeriodo==='todo'?'on':''}" onclick="rkPeriodo='todo';render()">Acumulado</button><button class="${rkPeriodo==='semana'?'on':''}" onclick="rkPeriodo='semana';render()">Semana</button><button class="${rkPeriodo==='mes'?'on':''}" onclick="rkPeriodo='mes';render()">Mes</button></div>`);
  const {stats, badgesDe} = computeTeamStats();
  guardarSnapshotRanking(stats);
  let nota = '', pts = s => s.puntos, cer = s => s.cerrados;
  if (rkPeriodo !== 'todo') {
    const snap = snapshotHace(rkPeriodo === 'semana' ? 7 : 30);
    if (snap) {
      const prev = u => snap.datos.find(d => d.user === u) || {puntos:0, cerrados:0};
      pts = s => Math.max(0, s.puntos - prev(s.u.user).puntos); cer = s => Math.max(0, s.cerrados - prev(s.u.user).cerrados);
      nota = `Comparado contra el ${snap.fecha} (guardado en este dispositivo).`;
    } else nota = 'Este dispositivo aún no junta suficiente historial para este periodo; se muestra el acumulado.';
  }
  const ranked = [...stats].sort((a,b) => pts(b) - pts(a));
  const top = ranked.slice(0,3), resto = ranked.slice(3);
  const pod = (s, i) => { if (!s) return '<div class="pod"></div>'; const nv = nivelDe(s.puntos), yo = s.u.user === currentUser.user; const h = i===0?150:i===1?118:100;
    return `<div class="pod ${i===0?'first':''}" onclick="rkAbierto.has('${s.u.user}')?rkAbierto.delete('${s.u.user}'):rkAbierto.add('${s.u.user}');render()">
      <div style="font-size:${i===0?28:22}px">${['🥇','🥈','🥉'][i]}</div><div class="avatar" style="${yo?'box-shadow:0 0 0 3px var(--brand)':''}">${esc(s.u.nombre.charAt(0))}</div>
      <div class="pod-name">${esc(s.u.nombre)}${yo?' (tú)':''}</div><div class="pod-lvl" style="color:${nv.color}">${nv.nombre}</div>
      <div class="pod-base" style="height:${h}px"><div class="pod-pts num">${Math.round(pts(s))}</div><div class="hint">puntos</div></div></div>`; };
  const det = s => `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:13px">
    <span>Llamadas hechas <b style="float:right">${s.llR}</b></span><span>WhatsApps <b style="float:right">${s.msj}</b></span>
    <span>Asesorías agendadas <b style="float:right">${s.viA}</b></span><span>Asesorías hechas <b style="float:right">${s.viR}</b></span>
    <span>Conversión <b style="float:right">${s.tasa}%</b></span><span>Asistencia <b style="float:right">${s.asistencia!=null?s.asistencia+'%':'—'}</b></span>
    <span>Pendientes <b style="float:right">${s.pendientes}</b></span><span>Vencidos <b style="float:right">${s.vencidos}</b></span></div>`;
  const badges = s => { const b = badgesDe(s); return b.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${b.map(x=>`<span class="chip brand">${x}</span>`).join('')}</div>` : ''; };
  const lider = ranked[0];
  el.innerHTML = `${nota?`<p class="hint" style="text-align:center;margin-bottom:10px">${nota}</p>`:''}
    <div class="podium">${pod(top[1],1)}${pod(top[0],0)}${pod(top[2],2)}</div>
    ${top.filter(s=>s&&rkAbierto.has(s.u.user)).map(s=>`<div class="block" style="max-width:560px;margin:0 auto 10px"><b>${esc(s.u.nombre)}</b>${badges(s)}${det(s)}</div>`).join('')}
    <div style="max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:8px">${resto.map((s,j) => { const i = j+3, yo = s.u.user===currentUser.user, nv = nivelDe(s.puntos), gap = lider ? Math.max(0, pts(lider)-pts(s)) : 0, meta = Math.min(100, s.cerrados/META_CIERRES*100);
      return `<div class="rk-row ${yo?'me':''}" onclick="rkAbierto.has('${s.u.user}')?rkAbierto.delete('${s.u.user}'):rkAbierto.add('${s.u.user}');render()">
        <span class="rk-pos">${i+1}</span>
        <div style="min-width:0"><div style="font-weight:700">${esc(s.u.nombre)}${yo?' <span class="chip brand">tú</span>':''} <span style="color:${nv.color};font-size:13px;font-weight:600">${nv.nombre}</span></div>
          <div class="hint">${plural(cer(s),'cierre')} · ${Math.round(pts(s))} pts${gap?` · le faltan ${Math.round(gap)} para el primer lugar`:''}</div>
          <div class="goal" data-tip="Meta: ${META_CIERRES} cierres"><i style="width:${meta}%;${meta>=100?'background:var(--good)':''}"></i></div>
          ${badges(s)}${rkAbierto.has(s.u.user)?det(s):''}</div>
        <span class="hint">${rkAbierto.has(s.u.user)?'▲':'▼'}</span></div>`; }).join('')}</div>
    <p class="hint" style="text-align:center;margin-top:18px">Puntos = cierres × 10 + cada llamada, WhatsApp o asesoría registrada + asistencia ÷ 2 − pasos vencidos × 5</p>`;
}

<script>
// ══════════════════════════════════════════════════════════════
// PANTALLA: CONTENIDO — de dónde llega el tráfico y qué pide
// ══════════════════════════════════════════════════════════════
const ORDEN_ENG = ['Sin enganche aún','Menos de $30,000','$30,000–$60,000','Más de $60,000'];
const ORDEN_HIS = ['Limpio y al corriente','Deudas menores al corriente','Sin historial previo','Retrasos o deudas sin pagar'];
const ORDEN_ING = ['Menos de $12,000','$12,000–$20,000','$20,000–$35,000','Más de $35,000'];
const REDES = [['tiktok','TikTok'],['instagram','Instagram'],['facebook','Facebook'],['youtube','YouTube'],['whatsapp','WhatsApp'],['google','Google'],['otro','Otro']];
let LB = {red:'tiktok', destino:'quiz', contenido:'', campana:''};

function fuenteDe(l){ const s = S(l); if (s.origen) return s.origen.toLowerCase(); if (s.fuenteContacto === 'Asesoría Personalizada') return 'landing asesoría'; return 'sin etiqueta'; }
const redNombre = k => (REDES.find(r => r[0]===k) || [k, k.charAt(0).toUpperCase()+k.slice(1)])[1];
function contar(arr, fn){ const o = {}; arr.forEach(x => { const k = fn(x); if (k) o[k] = (o[k]||0)+1; }); return o; }
function ordenado(obj, orden){ return orden ? orden.filter(k => obj[k]).map(k => [k, obj[k]]).concat(Object.entries(obj).filter(([k]) => !orden.includes(k))) : Object.entries(obj).sort((a,b) => b[1]-a[1]); }
const esSA = l => l.perfil === 'S' || l.perfil === 'A';

function lecturas(enPer, r){
  const out = [];
  const n = enPer.length; if (n < 10) return [{t:'Todavía hay pocos datos', p:`Solo ${plural(n,'lead')} en ${r.txt}. Las lecturas se vuelven útiles a partir de unos 20.`, b:''}];
  const loc = enPer.filter(l => l.local);
  const pl = pct(loc.length, n);
  const fuera = ordenado(contar(enPer.filter(l => !l.local), l => l.estado || 'Sin estado')).slice(0,3).map(([k]) => k);
  if (pl < 35) out.push({t:'La mayoría del tráfico no puede comprar aquí', p:`Solo ${pl}% de los leads de ${r.txt} son de zona local (Puebla, Tlaxcala, Hidalgo, Veracruz). Lo demás viene sobre todo de ${fuera.join(', ')}. Si la meta es vender en agencia, conviene que los ganchos y textos digan claramente que es en Puebla: lugares reconocibles, "aquí en Puebla", la agencia de fondo.`, b:`${loc.length} locales de ${n}`});
  else out.push({t:`${pl}% del tráfico es de zona local`, p:`El contenido está atrayendo a gente que sí puede comprar aquí. Mantén las referencias locales que estén funcionando.`, b:`${loc.length} locales de ${n}`});

  if (loc.length >= 8) {
    const mods = ordenado(contar(loc, l => l.modeloCorto !== '—' ? l.modeloCorto : ''));
    if (mods.length) { const [m, c] = mods[0]; const seg = mods[1]; out.push({t:`El ${m} es lo que más piden los locales`, p:`${pct(c,loc.length)}% de los leads locales salió con el ${m}${seg?` y le sigue el ${seg[0]} (${pct(seg[1],loc.length)}%)`:''}. Más piezas de ese modelo, y comparativos entre los dos, hablan directo a quien sí puede comprar.`, b:`${c} de ${loc.length} locales`}); }
    const engBajo = loc.filter(l => ['Sin enganche aún','Menos de $30,000'].includes(l.enganche)).length;
    const conEng = loc.filter(l => l.enganche).length;
    if (conEng >= 8 && engBajo/conEng >= 0.4) out.push({t:'El enganche es la barrera más común', p:`${pct(engBajo,conEng)}% de los locales tiene menos de $30,000 de enganche o todavía nada. Contenido que explique cuánto se necesita realmente, opciones con enganche bajo y cómo juntarlo responde a su duda principal.`, b:`${engBajo} de ${conEng} locales`});
    const hisMal = loc.filter(l => ['Retrasos o deudas sin pagar','Sin historial previo'].includes(l.historial)).length;
    const conHis = loc.filter(l => l.historial).length;
    if (conHis >= 8 && hisMal/conHis >= 0.3) out.push({t:'Muchos dudan por su historial de crédito', p:`${pct(hisMal,conHis)}% de los locales no tiene historial o tiene retrasos. Videos sobre "¿me dan crédito si…?" y primer crédito automotriz atienden esa objeción antes de que llegue al asesor.`, b:`${hisMal} de ${conHis} locales`});
    const sa = loc.filter(esSA).length;
    out.push(sa/loc.length >= 0.5
      ? {t:'La calidad financiera de los locales es buena', p:`${pct(sa,loc.length)}% de los locales salió con perfil S o A. Aquí el reto está más en el seguimiento del equipo que en el contenido.`, b:`${sa} de ${loc.length} locales`}
      : {t:'La mayoría de los locales sale con perfil B o C', p:`Solo ${pct(sa,loc.length)}% salió con perfil S o A. Contenido educativo (cómo mejorar el perfil, qué piden los bancos) puede subir la calidad de los leads.`, b:`${sa} de ${loc.length} locales`});
  }

  const conHora = enPer.filter(l => l.hora != null);
  if (conHora.length >= 20) {
    const porH = Array(24).fill(0); conHora.forEach(l => porH[l.hora]++);
    let best = 0, bh = 0; for (let h=0; h<24; h++) { const v = porH[h] + porH[(h+1)%24] + porH[(h+2)%24]; if (v > best) { best = v; bh = h; } }
    const porD = Array(7).fill(0); conHora.forEach(l => porD[l.dow]++);
    const bd = porD.indexOf(Math.max(...porD));
    const hh = h => `${h%12||12} ${h<12?'a. m.':'p. m.'}`;
    out.push({t:`Los leads llegan sobre todo entre ${hh(bh)} y ${hh((bh+3)%24)}`, p:`${pct(best,conHora.length)}% llega en esa franja y el día más fuerte es el ${['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][bd]}. Publicar una o dos horas antes ayuda a que el contenido esté arriba cuando la gente está buscando.`, b:`${conHora.length} leads con hora registrada`});
  }

  const tagged = enPer.filter(l => S(l).origen);
  if (tagged.length >= 10) {
    const g = ordenado(contar(tagged, fuenteDe));
    const tasaLoc = g.map(([k,c]) => [k, c, pct(tagged.filter(l => fuenteDe(l)===k && l.local).length, c)]).filter(x => x[1] >= 5);
    if (tasaLoc.length >= 2) { const vol = tasaLoc[0], cal = [...tasaLoc].sort((a,b)=>b[2]-a[2])[0];
      out.push({t: vol[0]===cal[0] ? `${redNombre(vol[0])} trae más leads y los más locales` : `${redNombre(vol[0])} trae más leads, pero ${redNombre(cal[0])} trae más locales`, p:`${redNombre(vol[0])}: ${vol[1]} leads, ${vol[2]}% locales. ${redNombre(cal[0])}: ${cal[1]} leads, ${cal[2]}% locales. El volumen no es lo mismo que gente que puede comprar.`, b:`${tagged.length} leads con origen etiquetado`}); }
  } else {
    out.push({t:'Aún no sabemos qué video trae a cada lead', p:`${pct(tagged.length,n)}% de los leads de ${r.txt} trae etiqueta de origen. Usa el generador de links de abajo en la bio y en cada publicación, y en unas semanas esta pantalla te dirá qué contenido trae compradores, no solo vistas.`, b:''});

    const angulo = {'No le aprueban el crédito':'Contenido que explique requisitos reales de crédito filtra y prepara mejor a los prospectos.','Mensualidad o precio alto':'Contenido de valor (equipamiento, garantía, costo por kilómetro) ayuda a justificar el precio antes de la cotización.','No tiene enganche todavía':'Contenido sobre planes con enganche bajo o cómo juntarlo ataca justo esto.','Compró otra marca':'Comparativos honestos contra la competencia directa ayudan a que nos elijan.','No contesta / no responde':'Esto suele ser de seguimiento más que de contenido; revisa la velocidad del primer contacto.'}[m] || '';
    out.push({t:`Se pierden sobre todo por: ${m.toLowerCase()}`, p:`${pct(c,perd.length)}% de los perdidos con motivo registrado. ${angulo}`, b:`${perd.length} perdidos con motivo`});
  }
  return out;
}

function heatmap(leads){
  const m = Array.from({length:7}, () => Array(24).fill(0));
  leads.forEach(l => { if (l.hora != null) m[l.dow][l.hora]++; });
  const max = Math.max(1, ...m.flat());
  const ramp = ['#173a66','#1c5cab','#2a78d6','#3987e5','#6da7ec','#9ec5f4'];
  const color = v => v ? ramp[Math.min(ramp.length-1, Math.floor(v/max*(ramp.length-0.01)))] : '';
  const orden = [1,2,3,4,5,6,0];
  let h = `<div class="heat"><span></span>${Array.from({length:24},(_,i)=>`<span class="hx">${i}</span>`).join('')}`;
  orden.forEach(d => { h += `<span>${DIAS[d]}</span>` + m[d].map((v,hr) => `<i style="${v?`background:${color(v)}`:''}" data-tip="${DIAS[d]} ${hr}:00–${hr}:59 · ${plural(v,'lead')}"></i>`).join(''); });
  return h + `</div><div class="legend"><span>Menos</span>${ramp.map(c=>`<span><i style="background:${c};margin:0"></i></span>`).join('')}<span>Más leads</span></div>`;
}

function slug(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60); }
function lbURL(){

    return {red, cont, c, loc: gl.length, sa: gl.filter(esSA).length, cie: g.filter(l=>etapa(l)==='cerrado').length}; }).sort((a,b) => b.loc - a.loc || b.c - a.c).slice(0, 12);
  // Zona por mes

  const zonaMes = meses.map(m => ({l: mesLabel(m), vals:[LEADS.filter(l=>!l.test&&l.mes===m&&l.local).length, LEADS.filter(l=>!l.test&&l.mes===m&&!l.local).length]}));

  const mods = ordenado(contar(loc, l => l.modeloCorto !== '—' ? l.modeloCorto : '')).slice(0, 8);
  const eng = ordenado(contar(loc, l => l.enganche), ORDEN_ENG), his = ordenado(contar(loc, l => l.historial), ORDEN_HIS), ing = ordenado(contar(loc, l => l.ingreso), ORDEN_ING);
  const totF = arr => arr.reduce((a,[,v]) => a+v, 0);

  el.innerHTML = `
    <div class="tiles">
      <div class="tile"><div class="tile-l">Leads del periodo</div><div class="tile-v num">${enPer.length}</div><div class="tile-s">sin contar pruebas</div></div>
      <div class="tile"><div class="tile-l">De zona local</div><div class="tile-v num">${pct(loc.length, enPer.length)}%</div><div class="tile-s">${loc.length} pueden comprar en agencia</div></div>
      <div class="tile"><div class="tile-l">Locales con perfil S o A</div><div class="tile-v num">${pct(loc.filter(esSA).length, loc.length)}%</div><div class="tile-s">${loc.filter(esSA).length} con buen perfil financiero</div></div>
      <div class="tile"><div class="tile-l">Con origen etiquetado</div><div class="tile-v num">${pct(tagged.length, enPer.length)}%</div><div class="tile-s">${tagged.length ? 'sabemos de qué red llegaron' : 'empieza a usar los links de abajo'}</div></div>
    </div>

    <div class="block" style="margin-top:16px"><div class="h2-row"><div class="h2">Lo que dicen los datos</div><span class="hint">Lecturas automáticas · ${r.txt}</span></div>
      ${lecturas(enPer, r).map(x => `<div class="insight"><span class="ico">${IC.bulb}</span><div><b>${esc(x.t)}</b><p>${esc(x.p)}</p>${x.b?`<div class="basis">Con base en ${esc(x.b)}</div>`:''}</div></div>`).join('')}
    </div>

    <div class="block" style="margin-top:16px"><div class="h2-row"><div class="h2">De dónde llegan</div><span class="hint">Por red social o página de origen</span></div>
      <div style="overflow-x:auto"><table class="tbl" style="min-width:600px"><thead><tr><th>Origen</th><th class="r">Leads</th><th class="r">Zona local</th><th class="r" data-tip="De los locales, cuántos tienen perfil S o A">Locales S/A</th><th class="r">Contactados</th><th class="r">Cierres</th></tr></thead>
      <tbody>${fuentes.map(f => `<tr onclick="${esContenido()?'':`irLeads({origen:'${esc(f.k==='landing asesoría'?'landing':f.k)}',zona:'todas'})`}" style="${esContenido()?'cursor:default':''}"><td><b>${esc(redNombre(f.k))}</b></td><td class="r num">${f.c}</td><td class="r num">${f.loc} <small class="hint">${pct(f.loc,f.c)}%</small></td><td class="r num">${f.sa}</td><td class="r num">${f.con}</td><td class="r num" style="${f.cie?'color:var(--good);font-weight:700':''}">${f.cie}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">Sin datos</td></tr>'}</tbody></table></div>
      ${fuentes.length === 1 && fuentes[0].k === 'sin etiqueta' ? '<p class="hint" style="margin-top:10px">Todo aparece como "sin etiqueta" porque los links todavía no llevan origen. Con el generador de abajo cada publicación se separa sola.</p>' : ''}
    </div>

    <div class="block" style="margin-top:16px"><div class="h2-row"><div class="h2">Qué contenido trae compradores</div><span class="hint">Ordenado por leads locales, no por vistas</span></div>
      ${conts.length ? `<div style="overflow-x:auto"><table class="tbl" style="min-width:560px"><thead><tr><th>Contenido</th><th>Red</th><th class="r">Leads</th><th class="r">Locales</th><th class="r">Locales S/A</th><th class="r">Cierres</th></tr></thead><tbody>${conts.map(c => `<tr style="cursor:default"><td><b>${esc(c.cont)}</b></td><td>${esc(redNombre(c.red))}</td><td class="r num">${c.c}</td><td class="r num">${c.loc}</td><td class="r num">${c.sa}</td><td class="r num" style="${c.cie?'color:var(--good);font-weight:700':''}">${c.cie}</td></tr>`).join('')}</tbody></table></div>`
        : '<div class="empty"><b>Aún no hay contenidos etiquetados</b>Cuando los links lleven el nombre del video, aquí verás cuál trae gente que sí compra.</div>'}
    </div>

    <div class="grid2" style="margin-top:16px">
      <div class="block"><div class="h2" style="margin-bottom:4px">Zona local vs fuera, por mes</div><p class="hint" style="margin-bottom:6px">Todos los leads de cada mes</p>
        ${columnas(zonaMes, [{n:'Zona local', c:'var(--s1)'}, {n:'Fuera de zona', c:'var(--s2)'}])}</div>
      <div class="block"><div class="h2" style="margin-bottom:14px">Estados de donde vienen</div>
        ${barras(estados.map(([k,v]) => ({l:k, v, s:`${pct(v,enPer.length)}%`, cls: esLocal(k)?'emph':'dim', tip:`${k}: ${v} leads${esLocal(k)?' · zona local':''}`})))}
        <div class="legend"><span><i style="background:var(--brand)"></i>Zona local</span><span><i style="background:var(--muted-bar)"></i>Fuera de zona</span></div></div>
    </div>

    <div class="grid2" style="margin-top:16px">
      <div class="block"><div class="h2" style="margin-bottom:4px">Modelos que piden los locales</div><p class="hint" style="margin-bottom:12px">Modelo que les recomendó el test</p>${barras(mods.map(([k,v]) => ({l:k, v, s:`${pct(v,loc.length)}%`})))}</div>
      <div class="block"><div class="h2" style="margin-bottom:4px">Cuándo llegan los leads</div><p class="hint" style="margin-bottom:12px">Día y hora en que terminaron el test</p>
        ${enPer.some(l => l.hora != null) ? heatmap(enPer) : '<div class="empty">Los leads de este periodo no traen hora.</div>'}</div>
    </div>

    <div class="block" style="margin-top:16px"><div class="h2-row"><div class="h2">Lo que más les preocupa a los locales</div><span class="hint">Respuestas del test · ideas para contenido que resuelva objeciones</span></div>
      <div class="grid3">
        <div><p class="hint" style="margin-bottom:10px">Enganche</p>${barras(eng.map(([k,v]) => ({l:k, v, s:`${pct(v,totF(eng))}%`})))}</div>
        <div><p class="hint" style="margin-bottom:10px">Historial de crédito</p>${barras(his.map(([k,v]) => ({l:k, v, s:`${pct(v,totF(his))}%`})))}</div>
        <div><p class="hint" style="margin-bottom:10px">Ingreso mensual</p>${barras(ing.map(([k,v]) => ({l:k, v, s:`${pct(v,totF(ing))}%`})))}</div>
      </div>
    </div>

    <div class="block" style="margin-top:16px">
      <div class="h2">Generador de links con origen</div>
      <p class="lead-in" style="margin:6px 0 16px">Usa un link distinto en la bio y en cada publicación. Así el CRM sabe qué red y qué video trajo a cada lead, y esta pantalla te dice cuál trae compradores.</p>
      <div class="grid2" style="gap:12px">
        <label class="field"><span>Red</span><select class="inp" id="lb-red" onchange="lbUpdate()">${REDES.map(([k,t])=>`<option value="${k}" ${LB.red===k?'selected':''}>${t}</option>`).join('')}</select></label>
        <label class="field"><span>A dónde lleva</span><select class="inp" id="lb-dest" onchange="lbUpdate()"><option value="quiz" ${LB.destino==='quiz'?'selected':''}>Test (quiz)</option><option value="landing" ${LB.destino==='landing'?'selected':''}>Asesoría Personalizada</option></select></label>
        <label class="field"><span>Nombre del contenido</span><input class="inp" id="lb-cont" value="${esc(LB.contenido)}" placeholder="Ej. bio, ex2-enganche-bajo, coolray-vs-mg" oninput="lbUpdate()"></label>
        <label class="field"><span>Campaña (opcional)</span><input class="inp" id="lb-camp" value="${esc(LB.campana)}" placeholder="Ej. octubre-2026" oninput="lbUpdate()"></label>
      </div>
      <div class="linkbox" style="margin-top:4px"><code id="lb-out">${esc(lbURL())}</code><button class="btn btn-primary" onclick="lbCopiar()">${IC.copy} Copiar</button></div>
      <p class="hint" style="margin-top:10px">Tip: usa nombres cortos y siempre iguales para el mismo video (por ejemplo <b>ex2-enganche-bajo</b>). Para la bio usa <b>bio</b>.</p>
    </div>`;
}
</script>
<style>
/* ── FICHA RÁPIDA (link directo por lead) ── */
#rapido{min-height:100dvh;overflow-y:auto;padding:18px 16px calc(28px + var(--safe-b));max-width:520px;margin:0 auto}
body.modo-rapido{overflow:auto}
.r-top{display:flex;align-items:center;justify-content:space-between;color:var(--ink-3);font-size:13px;margin-bottom:14px}
.r-top b{font-family:var(--cond);font-size:17px;color:var(--ink)}
.r-top b span{color:var(--brand)}
.r-name{font-family:var(--cond);font-weight:600;font-size:30px;line-height:1.08;overflow-wrap:anywhere}
.r-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.r-facts{font-size:14px;color:var(--ink-2);margin-top:12px;line-height:1.5}
.r-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.r-acts .btn{min-height:48px;font-size:15px}
.r-q{font-family:var(--cond);font-weight:600;font-size:20px;margin:24px 0 10px}
.big-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big-opt{min-height:62px;padding:10px 12px;border-radius:14px;border:1px solid var(--line-2);background:var(--panel);text-align:left;font-weight:600;font-size:15px;line-height:1.25;display:flex;align-items:center;gap:10px}
.big-opt i{font-style:normal;font-size:20px}
.big-opt.on{border-color:var(--brand);background:var(--brand-dim)}
.big-opt.bad.on{border-color:var(--bad);background:rgba(242,89,107,.12)}
.r-done{text-align:center;padding:30px 10px}
.r-done .ok{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:rgba(47,203,138,.15);color:var(--good)}
.r-done .ok svg{width:32px;height:32px}
.r-log{margin-top:24px;border-top:1px solid var(--line);padding-top:14px}
</style>
<div id="rapido" hidden></div>
<script>
// ══════════════════════════════════════════════════════════════
// LINK DIRECTO POR LEAD — crm.html?l=<id>&k=<clave>
// El asesor lo recibe en el WhatsApp/correo de asignación y actualiza el lead
// en un toque, sin contraseña. La clave depende del lead y del asesor asignado:
// si el lead se reasigna, el link anterior deja de funcionar.
// ══════════════════════════════════════════════════════════════
// La clave la crea el servidor (Apps Script) con un secreto que nunca llega a esta página.
let MODO_RAPIDO = false, RL = null, LINK_AUTH = null; // RL = {id, res, motivo, cita, hecho}
const CLAVES = {}; // "id|asesor" → clave ya pedida al servidor

async function clavesLinks(ids, user){
  const falta = ids.filter(id => !CLAVES[id + '|' + user]);
  if (falta.length) {
    const r = await api({tipo:'link_crear', sesion: SESION, ids: falta, user});
    if (r.ok) Object.entries(r.claves || {}).forEach(([id, k]) => CLAVES[id + '|' + user] = k);
    else if (r.error === 'sesion') sesionVencida();
  }
  return ids.map(id => CLAVES[id + '|' + user] || '');
}
function urlLink(id, k){
  const base = location.origin && location.origin !== 'null' ? location.origin + location.pathname : 'https://asesoresdigitalesg.github.io/geely-quiz/crm.html';
  return `${base}?l=${id}&k=${k}`;
}
async function copiarLinkLead(id){
  const user = S(BYID[id]).asignado;
  let k = '';
  try { [k] = await clavesLinks([id], user); } catch {}
  if (!k) { toast('No se pudo crear el link. Revisa tu conexión.'); return; }
  const u = urlLink(id, k);
  try { await navigator.clipboard.writeText(u); toast('Link copiado'); } catch { prompt('Copia el link:', u); }
}

const RL_RES = [
  {k:'hablamos',  i:'💬', t:'Hablamos / me respondió', paso:'Dar seguimiento'},
  {k:'sinresp',   i:'⏳', t:'Le escribí, no contesta',  paso:'Volver a escribirle'},
  {k:'asesoria',  i:'📹', t:'Agendó asesoría',          paso:'Hacer la asesoría', fecha:true},
  {k:'cita',      i:'🏢', t:'Agendó cita en agencia',   paso:'Confirmar la cita', fecha:true},
  {k:'cerro',     i:'🎉', t:'Ya compró',                fin:true},
  {k:'nointeresa',i:'✋', t:'No le interesa',           fin:true, bad:true},
];
const RL_CUANDO = () => {
  const out = [];
  const m = addDias(new Date(),1); m.setHours(10,0,0,0); out.push(['Mañana', isoHora(m)]);
  const d2 = addDias(new Date(),2); d2.setHours(10,0,0,0); out.push(['En 2 días', isoHora(d2)]);
  const d3 = addDias(new Date(),3); d3.setHours(10,0,0,0); out.push(['En 3 días', isoHora(d3)]);
  const w = addDias(new Date(),7); w.setHours(10,0,0,0); out.push(['En una semana', isoHora(w)]);
  return out;
};

async function iniciarModoRapido(id, clave){
  MODO_RAPIDO = true;
  document.body.classList.add('modo-rapido');
  $('login').hidden = true; $('app').hidden = true;
  const box = $('rapido'); box.hidden = false;
  box.innerHTML = '<div class="empty" style="padding-top:30vh"><b>Abriendo tu lead…</b></div>';
  const invalido = () => box.innerHTML = `<div class="empty" style="padding-top:26vh"><b>Este link ya no es válido</b>Puede que el lead se haya reasignado a otra persona.<br><br><a class="btn" href="${location.pathname}">Entrar al CRM</a></div>`;
  let r;
  try { r = await api({tipo:'link_leer', l: id, k: clave}); } catch (e) { r = {ok:false, error:'red'}; }
  if (!r.ok) {
    if (r.error === 'link') invalido();
    else box.innerHTML = '<div class="empty" style="padding-top:30vh"><b>No se pudo cargar</b>Revisa tu conexión y vuelve a abrir el link.</div>';
    return;
  }
  aplicarEquipo(r.equipo);
  const rows = []; rows[0] = {c:[]}; rows[id + 1] = r.row; // misma posición que en el Sheet
  procesarFilas(rows);
  const l = BYID[id];
  if (!l) { invalido(); return; }
  LINK_AUTH = {l: id, k: clave};
  currentUser = USERS.find(u => u.user === r.asignado) || {user: r.asignado || 'link', nombre: 'Asesor', role:'asesor'};
  RL = {id, res:'', motivo:'', cita:'', hecho:false};
  renderRapido();
}

function renderRapido(){
  const box = $('rapido'); if (!RL) return;
  const l = BYID[RL.id], s = S(l), e = etapa(l);
  const sp = siguientePaso(l);
  const res = RL_RES.find(r => r.k === RL.res);
  const top = `<div class="r-top"><b>ADG <span>CRM</span></b><span>${esc(firstName(currentUser.nombre))}</span></div>`;

  if (RL.hecho) {
    box.innerHTML = top + `<div class="r-done"><div class="ok">${IC.check}</div>
      <div class="h2" style="font-size:22px">Listo, quedó actualizado</div>
      <p class="hint" style="margin-top:6px">${esc(l.nombre)} · ${ETAPAS[ETAPA_IDX[e]].label}</p>
      ${sp ? `<div class="next-card" style="margin-top:18px;text-align:left"><div class="next-t">${esc(sp.texto)}</div><div class="next-d">${cuando(sp.iso)}</div></div>` : ''}
      <div style="display:grid;gap:8px;margin-top:22px">
        <button class="btn" onclick="RL.hecho=false;RL.res='';renderRapido()">Registrar otra cosa</button>
        <a class="btn btn-ghost" href="${location.pathname}">Abrir mi CRM completo</a>
      </div></div>`;
    return;
  }

  const ultimos = (s.bitacora || []).slice(0, 3);
  box.innerHTML = top + `
    <div class="r-name">${esc(l.nombre)}</div>
    <div class="r-meta">${pfHTML(l.perfil)}<span class="chip ${l.local?'good':''}">${esc(l.estado||'Sin estado')}</span><span class="chip">${ETAPAS[ETAPA_IDX[e]].label}</span><span class="chip">Llegó ${hace(l.dt)}</span></div>
    <div class="r-facts"><b>${esc(l.modelo || '—')}</b><br>Ingreso ${esc(l.ingreso||'—')} · Enganche ${esc(l.enganche||'—')}<br>Historial: ${esc(l.historial||'—')}</div>
    ${sp ? `<div class="next-card ${sp.estado==='vencido'?'late':''}" style="margin-top:14px"><div class="next-t">${esc(sp.texto)}</div><div class="next-d">${sp.estado==='vencido'?'Vencido · ':''}${cuando(sp.iso)}</div></div>` : ''}
    <div class="r-acts">
      <a class="btn" href="tel:${esc(l.telefono)}">${IC.phone} Llamar</a>
      <button class="btn btn-wa" onclick="rapidoWA()">${IC.wa} WhatsApp</button>
    </div>

    <div class="r-q">¿Qué pasó?</div>
    <div class="big-opts">${RL_RES.map(r => `<button class="big-opt ${RL.res===r.k?'on':''} ${r.bad?'bad':''}" onclick="RL.res='${r.k}';RL.motivo='';renderRapido();setTimeout(()=>$('rl-sig')?.scrollIntoView({behavior:'smooth',block:'start'}),40)"><i>${r.i}</i>${r.t}</button>`).join('')}</div>

    ${res ? `<div id="rl-sig">${
      res.k === 'nointeresa' ? `<div class="r-q">¿Por qué?</div><div class="opts" style="flex-direction:column;align-items:stretch">${MOTIVOS_PERDIDA.map(m => `<button class="opt" style="height:auto;padding:12px 14px;text-align:left;font-size:14px" onclick="guardarRapido({motivo:'${esc(m)}'})">${m}</button>`).join('')}</div>`
      : res.k === 'cerro' ? `<button class="btn btn-primary btn-block" style="min-height:52px;margin-top:16px;font-size:16px" onclick="guardarRapido({})">Confirmar venta cerrada</button>`
      : res.fecha ? `<div class="r-q">¿Qué día y a qué hora?</div><input class="inp" type="datetime-local" id="rl-fecha" style="min-height:50px"><button class="btn btn-primary btn-block" style="min-height:52px;margin-top:10px;font-size:16px" onclick="guardarRapido({fecha:$('rl-fecha').value})">Guardar</button>`
      : `<div class="r-q">¿Cuándo le vuelves a escribir?</div><div class="big-opts">${RL_CUANDO().map(([t,v]) => `<button class="big-opt" style="min-height:52px;justify-content:center" onclick="guardarRapido({fecha:'${v}'})">${t}</button>`).join('')}</div>`
    }</div>` : ''}

    ${ultimos.length ? `<div class="r-log"><div class="hint" style="margin-bottom:6px">Lo último</div><div class="log">${ultimos.map(b => { const d = fromISO(b.t); return `<div class="log-i" data-k="${esc(b.k||'n')}"><i></i><div><div class="log-x">${esc(b.x)}</div><div class="log-t">${d?hace(d):esc(b.t)}${b.u?' · '+esc(nombreAsesor(b.u)):''}</div></div></div>`; }).join('')}</div></div>` : ''}
    <p style="text-align:center;margin-top:22px"><a class="hint" href="${location.pathname}">Abrir mi CRM completo</a></p>`;
}

function rapidoWA(){
  const l = BYID[RL.id];
  if (!telLimpio(l)) { toast('Este lead no tiene teléfono válido.'); return; }
  const ps = plantillas(l);
  const k = etapa(l) === 'nuevo' ? 'primer' : etapa(l) === 'contactado' ? 'asesoria' : 'seguimiento';
  const msg = (ps.find(p => p.k === k) || ps[0]).m;
  window.open(`https://wa.me/${telLimpio(l)}?text=${encodeURIComponent(msg)}`, '_blank');
}

function guardarRapido(o){
  const l = BYID[RL.id], s = S(l), e = etapa(l);
  const res = RL_RES.find(r => r.k === RL.res);
  if (res.fecha && !o.fecha) { toast('Elige el día y la hora.'); return; }
  const ahora = isoHora(new Date());
  const c = {ultimoContacto: ahora};
  if (!s.primerContacto) c.primerContacto = ahora;
  const inc = k => c[k] = (s[k]||0) + 1;
  const avanza = dest => { if (e !== 'perdido' && ETAPA_IDX[dest] > ETAPA_IDX[e]) c.etapa = dest; };
  let log = '';
  if (res.k === 'hablamos')   { inc('mensajesSeguimiento'); avanza('contactado'); c.taskText = res.paso; c.taskDate = o.fecha; log = `Hablamos → ${res.paso}, ${cuando(o.fecha)}`; }
  if (res.k === 'sinresp')    { inc('intentos'); c.taskText = res.paso; c.taskDate = o.fecha; log = `Sin respuesta → ${res.paso}, ${cuando(o.fecha)}`; }
  if (res.k === 'asesoria')   { inc('videollamadasAgendadas'); avanza('asesoria'); c.taskText = res.paso; c.taskDate = o.fecha; log = `Agendó asesoría: ${cuando(o.fecha)}`; }
  if (res.k === 'cita')       { inc('citaAgenciaAgendada'); avanza('cierre'); c.citaAgenciaFecha = o.fecha; c.taskText = res.paso; c.taskDate = o.fecha; log = `Agendó cita en agencia: ${cuando(o.fecha)}`; }
  if (res.k === 'cerro')      { c.etapa = 'cerrado'; c.fechaCierre = ahora; c.taskText = ''; c.taskDate = ''; c.motivoPerdida = ''; log = 'Venta cerrada'; }
  if (res.k === 'nointeresa') { c.etapa = 'perdido'; c.motivoPerdida = o.motivo; c.taskText = ''; c.taskDate = ''; log = `Perdido (${o.motivo})`; }
  guardar(l.id, c, {log: log + ' · desde link directo', k: res.k === 'cerro' || res.k === 'nointeresa' ? 'e' : 'c'});
  if (res.k === 'cerro') celebrar(l.nombre);
  RL.hecho = true; RL.res = '';
  renderRapido();
  window.scrollTo(0,0);
}

// Arranque: si la URL trae ?l=…&k=…, abre la ficha rápida en lugar del CRM
(function(){
  const p = new URLSearchParams(location.search);
  const id = p.get('l'), k = p.get('k');
  if (id !== null && k) window.addEventListener('DOMContentLoaded', () => iniciarModoRapido(parseInt(id,10), k));
})();
</script>
