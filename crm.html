<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F1319">
<title>ADG CRM · Geely Serdán</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   ADG CRM v2 — tema "tablero de noche"
   ══════════════════════════════════════════════════════════════ */
:root{
  --bg:#0F1319; --panel:#161B23; --raise:#1D2430; --raise-2:#232C3A;
  --line:#273040; --line-2:#344055;
  --ink:#E9EDF3; --ink-2:#A3ADBB; --ink-3:#6E7889;
  --brand:#2BD0F5; --brand-dim:rgba(43,208,245,.12);
  --action:#3B7BFF; --action-hi:#5A90FF;
  --good:#2FCB8A; --warn:#F2B544; --serious:#F08A4B; --bad:#F2596B;
  --wa:#1FAF5A;
  --pS:#2FCB8A; --pA:#2BD0F5; --pB:#F2B544; --pC:#F2596B;
  --s1:#3987e5; --s2:#d95926; --muted-bar:#3A4557;
  --r-lg:16px; --r:12px; --r-sm:8px;
  --cond:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── LOGIN ── */
#login{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:
  radial-gradient(900px 500px at 85% -10%,rgba(43,208,245,.10),transparent 60%),
  radial-gradient(700px 400px at -10% 110%,rgba(59,123,255,.10),transparent 60%),var(--bg);z-index:50}
.login-box{width:min(360px,100%)}
.login-mark{font-family:var(--cond);font-weight:700;font-size:44px;letter-spacing:.01em;line-height:1}
.login-mark span{color:var(--brand)}
.login-sub{color:var(--ink-3);margin:6px 0 28px;font-size:14px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.inp{width:100%;background:var(--raise);border:1px solid var(--line-2);border-radius:var(--r);padding:12px 14px;outline:none;font-size:15px}
.inp:focus{border-color:var(--brand)}
textarea.inp{resize:vertical;min-height:84px;line-height:1.45}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.login-err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}

/* ── BOTONES ── */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:var(--r);background:var(--raise);border:1px solid var(--line-2);font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--raise-2);border-color:#425069}
.btn-primary{background:var(--action);border-color:var(--action);color:#fff}
.btn-primary:hover{background:var(--action-hi);border-color:var(--action-hi)}
.btn-wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn-wa:hover{background:#25c466;border-color:#25c466}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--raise);color:var(--ink)}
.btn-danger{color:var(--bad);border-color:rgba(242,89,107,.35);background:rgba(242,89,107,.06)}
.btn-sm{min-height:32px;padding:0 11px;font-size:13px;border-radius:var(--r-sm)}
.btn-block{width:100%}
.btn svg{width:17px;height:17px;flex-shrink:0}

/* ── LAYOUT ── */
#app{display:grid;grid-template-columns:236px 1fr;height:100vh;height:100dvh}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.rail-brand{padding:20px 20px 14px;font-family:var(--cond);font-weight:700;font-size:24px;line-height:1}
.rail-brand span{color:var(--brand)}
.rail-brand small{display:block;font-family:var(--sans);font-weight:500;font-size:12px;color:var(--ink-3);margin-top:4px}
.me{display:flex;align-items:center;gap:10px;margin:4px 12px 10px;padding:10px;border-radius:var(--r);background:var(--raise)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#06121a;background:var(--brand);flex-shrink:0}
.me-name{font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-role{font-size:12px;color:var(--ink-3)}
.me .btn-ghost{margin-left:auto;padding:0 8px;min-height:30px}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav-i{position:relative;display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:10px;color:var(--ink-2);font-weight:500;font-size:15px;text-align:left;width:100%}
.nav-i svg{width:19px;height:19px;flex-shrink:0}
.nav-i:hover{background:var(--raise);color:var(--ink)}
.nav-i.on{background:var(--brand-dim);color:var(--ink)}
.nav-i.on::before{content:'';position:absolute;left:-10px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.nav-i.on svg{color:var(--brand)}
.badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.badge.soft{background:var(--raise-2);color:var(--ink-2)}
.rail-foot{padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.sync-line{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);padding:0 4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex-shrink:0}
.dot.busy{background:var(--warn)}.dot.err{background:var(--bad)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 28px;border-bottom:1px solid var(--line);background:var(--bg)}
.topbar h1{font-family:var(--cond);font-weight:600;font-size:26px;line-height:1.1;letter-spacing:.005em}
.topbar .sub{color:var(--ink-3);font-size:13px;margin-top:2px}
.topbar-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.content{flex:1;overflow-y:auto;padding:24px 28px 40px;-webkit-overflow-scrolling:touch}
.screen{display:none;max-width:1240px;margin:0 auto}
.screen.on{display:block}
.screen.wide{max-width:none}
.tabbar{display:none}

/* ── BLOQUES ── */
.block{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.block+.block,.stack>*+*{margin-top:16px}
.grid2>.block,.grid3>.block,.grid-12>.block{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-12{display:grid;grid-template-columns:7fr 5fr;gap:16px;align-items:start}
.h2{font-family:var(--cond);font-weight:600;font-size:19px;line-height:1.2}
.h2-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.hint{color:var(--ink-3);font-size:13px}
.lead-in{color:var(--ink-2);font-size:14px;max-width:70ch}
.empty{padding:28px 12px;text-align:center;color:var(--ink-3);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px;font-weight:600}
.divider{height:1px;background:var(--line);margin:16px 0}

/* Indicadores */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.tile{background:var(--panel);padding:16px 18px;min-width:0}
.tile-l{font-size:13px;color:var(--ink-2)}
.tile-v{font-family:var(--cond);font-weight:600;font-size:34px;line-height:1.05;margin-top:6px}
.tile-s{font-size:12px;color:var(--ink-3);margin-top:4px}
.delta-up{color:var(--good)}.delta-down{color:var(--bad)}

/* Segmentado */
.seg{display:inline-flex;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--raise-2);color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--raise);color:var(--ink-2);white-space:nowrap}
.chip.good{background:rgba(47,203,138,.12);color:var(--good)}
.chip.warn{background:rgba(242,181,68,.13);color:var(--warn)}
.chip.bad{background:rgba(242,89,107,.13);color:var(--bad)}
.chip.brand{background:var(--brand-dim);color:var(--brand)}
.pf{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font-family:var(--cond);font-weight:700;font-size:14px;flex-shrink:0}
.pf-S{background:rgba(47,203,138,.15);color:var(--pS)}
.pf-A{background:rgba(43,208,245,.13);color:var(--pA)}
.pf-B{background:rgba(242,181,68,.14);color:var(--pB)}
.pf-C{background:rgba(242,89,107,.14);color:var(--pC)}
.pf-x{background:var(--raise);color:var(--ink-3)}
.fchip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:transparent;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.fchip.on{background:var(--brand-dim);border-color:rgba(43,208,245,.45);color:var(--ink)}

/* ── EL CARRIL DEL CICLO (elemento firma) ── */
.lane{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;width:96px}
.lane i{height:5px;border-radius:2px;background:var(--line-2)}
.lane i.on{background:var(--brand)}
.lane.won i.on{background:var(--good)}
.lane.lost i.on{background:#5b4450}
.lane.lost i.cut{background:var(--bad)}
.lane-big{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.lane-step{text-align:left;padding:8px 0 0;border-top:5px solid var(--line-2);font-size:12px;color:var(--ink-3);font-weight:600;line-height:1.2;transition:border-color .15s,color .15s}
.lane-step:hover{color:var(--ink)}
.lane-step.on{border-color:var(--brand);color:var(--ink-2)}
.lane-step.cur{color:var(--ink)}
.lane-big.won .lane-step.on{border-color:var(--good)}
.lane-big.lost .lane-step.on{border-color:#5b4450}

/* ── HOY ── */
.hoy-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hello{font-family:var(--cond);font-weight:600;font-size:30px;line-height:1.1}
.hello-sub{color:var(--ink-2);margin-top:4px}
.streak{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r);background:var(--raise);font-size:13px;color:var(--ink-2)}
.streak b{font-family:var(--cond);font-size:22px;color:var(--warn);font-weight:700}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.q-group{margin-top:22px}
.q-group:first-child{margin-top:0}
.q-title{display:flex;align-items:center;gap:4px 10px;margin-bottom:8px;flex-wrap:wrap}
.q-title .h2{font-size:17px}
.q-list{display:flex;flex-direction:column;gap:6px}
.q-row{display:grid;grid-template-columns:4px 1fr auto;gap:0 14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 0;cursor:pointer;transition:border-color .15s}
.q-row:hover{border-color:var(--line-2)}
.q-bar{align-self:stretch;border-radius:0 3px 3px 0;background:var(--ink-3)}
.q-row[data-k=primer] .q-bar{background:var(--brand)}
.q-row[data-k=vencido] .q-bar{background:var(--bad)}
.q-row[data-k=cita] .q-bar{background:var(--good)}
.q-row[data-k=hoy] .q-bar{background:var(--warn)}
.q-row[data-k=frio] .q-bar{background:var(--serious)}
.q-main{min-width:0}
.q-name{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.q-name span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-why{font-size:13px;color:var(--ink-2);margin-top:3px}
.q-meta{font-size:12px;color:var(--ink-3);margin-top:2px}
.q-acts{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--raise);border:1px solid var(--line-2);color:var(--ink-2)}
.icon-btn:hover{color:var(--ink);background:var(--raise-2)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.wa{color:var(--wa)}
.task-row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.check{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex-shrink:0;margin-top:1px;color:transparent;font-size:13px;font-weight:700}
.check.on{background:var(--good);border-color:var(--good);color:#06120c}
.task-row.done{opacity:.5}.task-row.done .t-text{text-decoration:line-through}
.t-text{font-size:14px}
.t-meta{font-size:12px;color:var(--ink-3);margin-top:2px}
.t-meta.late{color:var(--bad)}
.task-form{display:grid;grid-template-columns:1fr 210px auto;gap:8px}
.task-form.admin{grid-template-columns:170px 1fr 210px auto}

/* ── LEADS ── */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:200px;max-width:360px;position:relative}
.search .inp{padding-left:38px;height:40px}
.search svg{position:absolute;left:12px;top:11px;width:18px;height:18px;color:var(--ink-3)}
.toolbar select.inp{width:auto;height:40px;padding-top:0;padding-bottom:0;font-size:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.result-line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;color:var(--ink-3);font-size:13px;flex-wrap:wrap}
.bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;margin-bottom:10px;border-radius:var(--r);background:rgba(59,123,255,.10);border:1px solid rgba(59,123,255,.35)}
.bulk select.inp{width:auto;height:34px;padding-top:0;padding-bottom:0;font-size:14px}
.tbl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-3);padding:11px 12px;background:var(--raise);white-space:nowrap}
.tbl td{padding:11px 12px;border-top:1px solid var(--line);font-size:14px;vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:rgba(255,255,255,.02)}
.tbl .c{text-align:center}.tbl .r{text-align:right}
.cell-name{font-weight:600;display:flex;align-items:center;gap:6px}
.cell-sub{font-size:12px;color:var(--ink-3);margin-top:1px}
.zone-l{color:var(--good)}.zone-f{color:var(--ink-3)}
.late{color:var(--bad)}.soon{color:var(--warn)}
.cards-m{display:none}
.lead-card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.lead-card+.lead-card{margin-top:6px}
.lc-top{display:flex;align-items:center;gap:8px}
.lc-name{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-mid{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:13px;color:var(--ink-2)}
.more{display:flex;justify-content:center;margin-top:12px}

.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);display:flex;flex-direction:column;max-height:calc(100dvh - 250px)}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px}
.col-h i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px}
.col-b{padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.kcard{background:var(--raise);border:1px solid transparent;border-radius:10px;padding:10px 11px;cursor:pointer}
.kcard:hover{border-color:var(--line-2)}
.kc-name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.kc-meta{font-size:12px;color:var(--ink-3);margin-top:3px}
.kc-next{font-size:12px;margin-top:6px;color:var(--ink-2)}

/* ── FICHA ── */
.ov{position:fixed;inset:0;background:rgba(5,8,12,.62);z-index:30;display:none}
.ov.open{display:block}
.ficha{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:31;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .22s ease}
.ficha.open{transform:none}
.f-head{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.f-top{display:flex;align-items:flex-start;gap:12px}
.f-name{font-family:var(--cond);font-weight:600;font-size:26px;line-height:1.1;flex:1;min-width:0;overflow-wrap:anywhere}
.f-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.f-acts{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;margin-top:14px}
.f-body{flex:1;overflow-y:auto;padding:4px 20px 30px}
.f-sec{padding:18px 0;border-bottom:1px solid var(--line)}
.f-sec:last-child{border-bottom:none}
.f-sec>.h2{font-size:16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.next-card{background:var(--raise);border-radius:var(--r);padding:14px;border:1px solid var(--line-2)}
.next-card.late{border-color:rgba(242,89,107,.5)}
.next-card.none{border-style:dashed}
.next-t{font-weight:600}
.next-d{font-size:13px;color:var(--ink-2);margin-top:2px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.kv div{min-width:0}
.kv dt{font-size:12px;color:var(--ink-3)}
.kv dd{font-size:14px;margin-top:1px;overflow-wrap:anywhere}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tog{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--raise);border:1px solid var(--line);text-align:left;font-size:14px}
.tog .check{width:20px;height:20px}
.tog.on{border-color:rgba(47,203,138,.45)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--line-2);background:var(--raise);font-size:13px;font-weight:600;color:var(--ink-2)}
.opt.on{background:var(--brand-dim);border-color:rgba(43,208,245,.5);color:var(--ink)}
.opt.on.good{background:rgba(47,203,138,.14);border-color:rgba(47,203,138,.5)}
.opt.on.bad{background:rgba(242,89,107,.14);border-color:rgba(242,89,107,.5)}
.opt.on.warn{background:rgba(242,181,68,.14);border-color:rgba(242,181,68,.5)}
.log{display:flex;flex-direction:column}
.log-i{display:grid;grid-template-columns:12px 1fr;gap:10px;padding:8px 0}
.log-i i{width:8px;height:8px;border-radius:50%;background:var(--line-2);margin-top:6px}
.log-i[data-k=c] i{background:var(--brand)}
.log-i[data-k=e] i{background:var(--warn)}

.log-x{font-size:14px}
.log-t{font-size:12px;color:var(--ink-3)}
.counters{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ctr{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:10px;background:var(--raise);font-size:13px}

details.more-sec summary{cursor:pointer;color:var(--ink-2);font-weight:600;font-size:14px;list-style:none}
details.more-sec summary::-webkit-details-marker{display:none}
details.more-sec summary::before{content:'+ '}

/* Registrar contacto */
.reg{background:var(--raise);border:1px solid rgba(59,123,255,.45);border-radius:var(--r-lg);padding:16px;margin-top:14px}
.reg-l{font-size:13px;color:var(--ink-2);margin:12px 0 6px}
.reg-l:first-child{margin-top:0}
.quick-dates{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.reg-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

/* ── MODAL / TOAST / TOOLTIP ── */
.modal-ov{position:fixed;inset:0;background:rgba(5,8,12,.7);z-index:40;display:none;place-items:center;padding:16px}
.modal-ov.open{display:grid}
.modal{width:min(460px,100%);background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:22px;max-height:90dvh;overflow-y:auto}
.modal .h2{margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--raise-2);border:1px solid var(--line-2);color:var(--ink);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#tip{position:fixed;z-index:70;pointer-events:none;background:#0A0E13;border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.4;color:var(--ink);opacity:0;transition:opacity .1s;max-width:260px;white-space:pre-line}
#tip.show{opacity:1}
.win{position:fixed;inset:0;z-index:70;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .25s}
.win.show{opacity:1}
.win>div{background:var(--panel);border:1.5px solid var(--good);border-radius:20px;padding:26px 38px;text-align:center;box-shadow:0 20px 70px rgba(47,203,138,.28)}
.win b{display:block;font-family:var(--cond);font-size:30px;color:var(--good)}

/* ── GRÁFICAS ── */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(64px,auto);gap:10px;align-items:center;font-size:13px}
.bar-row .lbl{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .val{white-space:nowrap;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.bar-row .val small{color:var(--ink-3)}
.track{height:10px;border-radius:5px;background:var(--raise);position:relative;overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--s1)}
.fill.emph{background:var(--brand)}
.fill.dim{background:var(--muted-bar)}
.funnel{display:flex;flex-direction:column;gap:6px}
.fn-row{display:grid;grid-template-columns:150px 1fr 120px;gap:12px;align-items:center}
.fn-lbl{font-size:14px;color:var(--ink-2)}
.fn-bar{height:28px;border-radius:0 6px 6px 0;background:var(--s1);min-width:3px}
.fn-row:first-child .fn-bar{background:var(--brand)}
.fn-val{font-size:14px;font-variant-numeric:tabular-nums}
.fn-val small{color:var(--ink-3);margin-left:6px}
.fn-drop{font-size:12px;color:var(--ink-3);padding-left:162px;margin:-2px 0 2px}
.fn-drop.worst{color:var(--serious);font-weight:600}
.cols{display:grid;gap:10px;align-items:end;height:170px;padding-top:6px}
.cols .cc{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.stackbar{width:100%;max-width:46px;display:flex;flex-direction:column-reverse;gap:2px;flex:1;justify-content:flex-start}
.stackbar>i{display:block;width:100%;border-radius:3px}
.stackbar>i:last-child{border-radius:4px 4px 3px 3px}
.cols .cl{font-size:12px;color:var(--ink-3);white-space:nowrap}
.cols .cv{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.heat{display:grid;grid-template-columns:34px repeat(24,1fr);gap:2px;font-size:11px;color:var(--ink-3)}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--raise);display:block;min-width:0}
.heat span{display:flex;align-items:center}
.heat .hx{justify-content:center;font-size:10px}
.insight{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:16px 0;border-top:1px solid var(--line)}
.insight:first-child{border-top:none;padding-top:4px}
.insight .ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--brand-dim);color:var(--brand)}
.insight .ico svg{width:16px;height:16px}
.insight b{display:block;font-weight:600;font-size:15px;margin-bottom:3px}
.insight p{font-size:14px;color:var(--ink-2);max-width:72ch}
.insight .basis{font-size:12px;color:var(--ink-3);margin-top:4px}
.alerts{display:flex;flex-direction:column}
.alert{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.alert:first-child{border-top:none;padding-top:0}
.alert .big{font-family:var(--cond);font-weight:700;font-size:28px;line-height:1;text-align:right}
.alert .t{font-weight:600}
.alert .d{font-size:13px;color:var(--ink-3)}
.linkbox{display:flex;gap:8px;align-items:stretch}

/* Ranking */

.rk-row{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.rk-row.me{border-color:rgba(43,208,245,.5)}
.rk-pos{font-family:var(--cond);font-weight:700;font-size:20px;color:var(--ink-3);text-align:center}
.goal{height:6px;border-radius:3px;background:var(--raise);overflow:hidden;margin-top:8px}
.goal i{display:block;height:100%;background:var(--warn);border-radius:3px}

#diag{position:fixed;right:16px;bottom:16px;width:340px;max-height:50vh;overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;padding:12px;font-size:12px;z-index:65;display:none}
#diag.show{display:block}
#diag .ok{color:var(--good)}#diag .warn{color:var(--warn)}#diag .err{color:var(--bad)}

/* ══════════ RESPONSIVO ══════════ */

}

  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:10px;font-size:11px;font-weight:600;color:var(--ink-3);position:relative}

  .tab .badge{position:absolute;top:0;left:calc(50% + 6px);margin:0;height:17px;min-width:17px;font-size:11px;padding:0 4px}
  .grid2{grid-template-columns:1fr}
  .tbl-desk{display:none}
  .cards-m{display:block}
  .q-title .hint{flex-basis:100%;margin-left:0!important}
  .topbar{flex-wrap:wrap;row-gap:8px}
  .topbar .sub{display:none}
  .topbar-tools{margin-left:0;width:100%;overflow-x:auto}

  .f-acts{grid-template-columns:1fr 1fr}
  .f-acts .btn-primary{grid-column:1/-1}
  .fn-row{grid-template-columns:96px 1fr 92px;gap:8px}
  .fn-lbl{font-size:13px}

  .bar-row{grid-template-columns:96px 1fr minmax(52px,auto)}
  .toggles,.counters,.kv{grid-template-columns:1fr 1fr}
  .search{max-width:none;flex-basis:100%}
  .hello{font-size:25px}
  .heat{grid-template-columns:28px repeat(24,1fr);gap:1px}

  #toast{bottom:calc(86px + var(--safe-b))}
}

<body>

<script>
// ══════════════════════════════════════════════════════════════
// CONFIGURACIÓN — lo que más probablemente quieras cambiar está aquí
// ══════════════════════════════════════════════════════════════
const SHEET_ID          = "1KoUs2mBRY45y3endT8Tx6QnI1iHSvdGL4JTHQd1M96c";
const SHEET_NAME        = "Hoja 1";
const USERS_SHEET_NAME  = "Usuarios";
const TAREAS_SHEET_NAME = "Tareas";
const SCRIPT_URL        = "https://script.google.com/macros/s/AKfycbwB-ylsX33ZGE918Ty3s7YK0ZLXHv0en4aFbg_X4d7ac9iZ2C7s6JD6lTtRyi_yc1Po/exec";
const META_CIERRES      = 5;      // meta de cierres por asesor (Ranking)
const HORAS_PRIMER_CONTACTO = 24; // después de esto, un lead asignado sin tocar se marca como alerta
const DIAS_ENFRIANDO    = 4;      // días sin contacto para considerar que un lead "se enfría"
const QUIZ_URL          = "https://asesoresdigitalesg.github.io/geely-quiz/";
const LANDING_URL       = "https://asesoresdigitalesg.github.io/geely-quiz/asesoria-personalizada.html";
const AGENCIA_DIR       = "Blvd. Hermanos Serdán 788, San Rafael Oriente, Puebla";
const ESTADOS_LOCALES   = ['Puebla','Tlaxcala','Hidalgo','Veracruz'];
const TEST_NAMES        = ['prueba','test','demo','ejemplo','fake','trial'];

// role: 'admin' (líder) · 'asesor' (vendedor) · 'contenido' (equipo de contenido: solo ve datos agregados, sin teléfonos)
// El equipo y las contraseñas viven en el servidor (Apps Script). Esta lista se llena al iniciar sesión.
const USERS = [];
let SESION = '';
try { SESION = localStorage.getItem('crm_sesion') || ''; } catch {}
function aplicarEquipo(equipo){
  USERS.splice(0, USERS.length, ...(equipo || []));
  USERS.forEach(u => u.isAdmin = u.role === 'admin');
}
// Llamada al servidor que regresa una respuesta (inicio de sesión y lectura de datos)
async function api(body){
  const res = await fetch(SCRIPT_URL, {method:'POST', body: JSON.stringify(body)});
  const txt = await res.text();
  try { return JSON.parse(txt); } catch { return {ok:false, error:'respuesta', detalle: txt.slice(0,120)}; }
}
function sesionVencida(){
  try { localStorage.removeItem('crm_sesion'); } catch {}
  SESION = '';
  toast('Tu sesión venció. Vuelve a entrar.');
  setTimeout(() => location.reload(), 1500);
}

const ETAPAS = [
  {id:'nuevo',       label:'Nuevo',          color:'#6E7889'},
  {id:'contactado',  label:'Contactado',     color:'#9A8CF0'},
  {id:'asesoria',    label:'Asesoría',       color:'#2BD0F5'},
  {id:'seguimiento', label:'Seguimiento',    color:'#F2B544'},
  {id:'cierre',      label:'Cita de cierre', color:'#F08A4B'},
  {id:'cerrado',     label:'Cerrado',        color:'#2FCB8A'},
  {id:'perdido',     label:'Perdido',        color:'#F2596B'},
];
const CICLO = ETAPAS.slice(0,6);
const ETAPA_IDX = Object.fromEntries(ETAPAS.map((e,i)=>[e.id,i]));

const MOTIVOS_PERDIDA = ['No contesta / no responde','No le aprueban el crédito','No tiene enganche todavía','Compró otra marca','Mensualidad o precio alto','Ya no le interesa por ahora','Vive fuera de zona','Dato falso o duplicado','Otro'];

const CREDITO = [
  {id:'no_iniciada', label:'No iniciada', tone:''},
  {id:'en_proceso',  label:'En trámite',  tone:'warn'},
  {id:'aprobada',    label:'Aprobada',    tone:'good'},
  {id:'rechazada',   label:'Rechazada',   tone:'bad'},
];
const DOCS = [
  {key:'docINE',       label:'INE'},
  {key:'docIngresos',  label:'Comprobante de ingresos'},
  {key:'docDomicilio', label:'Comprobante de domicilio'},
  {key:'expediente',   label:'Expediente hecho'},
];

// Columnas del Sheet "Hoja 1" que escribe el CRM (índice base 0 de la lectura gviz).
// Las columnas T–X (19–23) son de otro sistema y no se tocan.
// [campo, columna, tipo, llave que entiende el Apps Script]
const CAMPOS = [
  ['etapa',13-1,'etapa'],
  ['notas',14-1,'text'],
  ['taskText',15-1,'text'],
  ['taskDate',16-1,'date'],
  ['ultimoContacto',17-1,'date'],
  ['fuenteContacto',18-1,'text'],
  ['intentos',19-1,'int'],
  ['asignado',25-1,'text'],
  ['llamadasAgendadas',26-1,'int'],
  ['llamadasRealizadas',27-1,'int'],
  ['videollamadasAgendadas',28-1,'int'],
  ['videollamadasRealizadas',29-1,'int'],
  ['mensajesSeguimiento',30-1,'int'],
  ['docINE',31-1,'bool'],
  ['docIngresos',32-1,'bool'],
  ['docDomicilio',33-1,'bool'],
  ['expediente',34-1,'bool'],
  ['creditoEstado',35-1,'text'],
  ['citaAgenciaAgendada',36-1,'int'],
  ['citaAgenciaFecha',37-1,'date'],
  ['confirmaciones',38-1,'int'],
  ['fechaObjetivoCierre',39-1,'date'],
  ['asistioReunion',40-1,'text'],
  ['telefonoConsistente',41-1,'text','telefono_consistente'],
  ['origen',42-1,'text'],
  ['contenido',43-1,'text'],
  ['campana',44-1,'text'],
  ['fechaAsignacion',45-1,'date'],
  ['primerContacto',46-1,'date'],
  ['motivoPerdida',47-1,'text'],
  ['bitacora',48-1,'json'],
  ['fechaCierre',49-1,'date'],
];
const CAMPO_TIPO = Object.fromEntries(CAMPOS.map(c=>[c[0],c[2]]));
const CAMPO_KEY  = Object.fromEntries(CAMPOS.map(c=>[c[0],c[3]||c[0]]));

// ══════════════════════════════════════════════════════════════
// UTILIDADES
// ══════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const pad = n => String(n).padStart(2,'0');
const plural = (n, s, p) => `${n} ${n===1?s:(p||s+'s')}`;
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const firstName = s => String(s||'').trim().split(/\s+/)[0] || '';
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];

let DIAG = [];
function dbg(msg, type='ok') {
  DIAG.unshift({t:new Date().toLocaleTimeString('es-MX'), msg, type});
  if (DIAG.length > 40) DIAG.pop();
  const el = $('diag');
  if (el && el.classList.contains('show')) renderDiag();
}
function renderDiag(){ $('diag').innerHTML = `<b>Diagnóstico</b> <button class="btn btn-sm btn-ghost" onclick="toggleDiag()" style="float:right">Cerrar</button><div style="clear:both;margin-top:8px">${DIAG.map(d=>`<div class="${d.type}">[${d.t}] ${esc(d.msg)}</div>`).join('')}</div>`; }
function toggleDiag(){ $('diag').classList.toggle('show'); renderDiag(); }

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }

// Tooltip compartido para gráficas: cualquier elemento con data-tip
(function(){
  const tip = () => $('tip');

// ══════════════════════════════════════════════════════════════
// FECHAS — el Sheet guarda fechas en varios formatos:
//   Date(2026,9,7,20,3,12)  (celda de fecha; mes base 0)
//   "7/10/2026, 8:03:12 p.m."  (texto del quiz, día/mes/año)
//   "2026-10-07" o "2026-10-07T20:15"  (lo que escribe el CRM)
// Todo se convierte a hora local de Puebla, sin desfases por UTC.
// ══════════════════════════════════════════════════════════════
function parseTexto(s) {
  if (!s) return null;
  s = String(s).replace(/[  ]/g,' ').trim();
  let m = s.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+)(?:,(\d+))?)?/);
  if (m) return {d:new Date(+m[1], +m[2], +m[3], +(m[4]||0), +(m[5]||0), +(m[6]||0)), t: m[4]!==undefined};
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ](\d{1,2}):(\d{2}))?/);
  if (m) return {d:new Date(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0)), t: m[4]!==undefined};
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:[,\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([ap])?\.?\s*m?\.?)?/i);
  if (m) {
    let y = +m[3]; if (y < 100) y += 2000;
    let h = +(m[4]||0); const ap = (m[7]||'').toLowerCase();
    if (ap==='p' && h<12) h += 12; if (ap==='a' && h===12) h = 0;
    return {d:new Date(y, +m[2]-1, +m[1], h, +(m[5]||0), +(m[6]||0)), t: m[4]!==undefined};
  }
  return null;
}
function cellRaw(cell){ return (!cell || cell.v == null) ? '' : cell.v; }
function cellTxt(cell){
  if (!cell || cell.v == null) return '';
  const v = String(cell.v);
  if (/^Date\(/.test(v)) return cell.f ? String(cell.f).trim() : v;
  return v.trim();
}
function cellFecha(cell){
  if (!cell || cell.v == null) return null;
  const r = parseTexto(String(cell.v));
  if (r && !isNaN(r.d)) return r;
  if (cell.f) { const r2 = parseTexto(cell.f); if (r2 && !isNaN(r2.d)) return r2; }
  return null;
}
function isoDia(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function isoHora(d){ return `${isoDia(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function cellISO(cell){ const r = cellFecha(cell); if (!r) return cellTxt(cell); return r.t ? isoHora(r.d) : isoDia(r.d); }
function fromISO(s){ if (!s) return null; const r = parseTexto(s); return r && !isNaN(r.d) ? r.d : null; }
function hasTime(s){ return /T\d/.test(String(s||'')); }
function hoy0(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function addDias(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function mismoDia(a,b){ return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function horasDesde(d){ return d ? (Date.now()-d.getTime())/3600000 : null; }
function diasDesde(d){ if (!d) return null; const a = new Date(d); a.setHours(0,0,0,0); return Math.round((hoy0()-a)/86400000); }
function mesKey(d){ return d ? `${d.getFullYear()}-${pad(d.getMonth()+1)}` : ''; }
function mesLabel(k, largo){ if(!k) return '—'; const [y,m]=k.split('-'); return largo ? `${MESES_L[+m-1]} ${y}` : `${MESES[+m-1]} ${y.slice(2)}`; }
function hace(d){
  if (!d) return '—';
  const h = horasDesde(d);
  if (h < 1) return 'hace minutos';
  if (h < 24) return `hace ${Math.floor(h)} h`;
  const dd = diasDesde(d);
  if (dd === 1) return 'ayer';
  if (dd < 7) return `hace ${dd} días`;
  if (dd < 60) return `hace ${Math.round(dd/7)} sem`;
  return `${d.getDate()} ${MESES[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`;
}
function cuando(iso){
  const d = fromISO(iso); if (!d) return '';
  const t = hasTime(iso) ? ` ${d.getHours()%12||12}:${pad(d.getMinutes())} ${d.getHours()<12?'a. m.':'p. m.'}` : '';
  const dd = -diasDesde(d);
  let dia;
  if (dd === 0) dia = 'hoy'; else if (dd === 1) dia = 'mañana'; else if (dd === -1) dia = 'ayer';
  else dia = `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`;
  return dia + t;
}
function horasTexto(h){ if (h==null) return '—'; if (h < 1) return `${Math.max(1,Math.round(h*60))} min`; if (h < 48) return `${h<10?h.toFixed(1):Math.round(h)} h`; return `${Math.round(h/24)} días`; }

// ══════════════════════════════════════════════════════════════
// ESTADO EN MEMORIA
// LEADS: datos que llegan del quiz (no cambian)
// ST[id]: campos de seguimiento del CRM (los que se editan)
// PEND[id][campo]: cambios recién enviados que el Sheet aún no refleja
// ══════════════════════════════════════════════════════════════
let currentUser = null;
let LEADS = [], BYID = {}, ST = {}, PEND = {};
let allTareas = [];
let ULTIMA_SYNC = null;

try { PEND = JSON.parse(localStorage.getItem('crm2_pend') || '{}'); } catch { PEND = {}; }
function guardarPend(){ try { localStorage.setItem('crm2_pend', JSON.stringify(PEND)); } catch {} }

const S = l => ST[l.id] || (ST[l.id] = vacio());
function vacio(){ const o={}; CAMPOS.forEach(([k,,t])=>{ o[k] = t==='int'?0 : t==='bool'?false : t==='json'?[] : ''; }); o.etapa='nuevo'; return o; }

function isYes(v){ const s=String(v).trim().toLowerCase(); return s==='1'||s==='sí'||s==='si'||s==='true'||s==='x'; }
function normalizeEtapa(val) {
  const v = String(val||'').toLowerCase().trim();
  if (!v) return 'nuevo';
  const map = {contacto:'contactado',contactados:'contactado',nuevos:'nuevo',interesado:'seguimiento',interesados:'seguimiento','en seguimiento':'seguimiento','asesoría':'asesoria','asesoria agendada':'asesoria','asesoría agendada':'asesoria',cita:'cierre','cita agendada':'cierre','cita de cierre':'cierre','test drive':'cierre',testdrive:'cierre',vendido:'cerrado',cancelado:'perdido'};
  const r = map[v] || v;
  return ETAPA_IDX[r] !== undefined ? r : 'nuevo';
}
function normCampo(tipo, cell) {
  switch (tipo) {
    case 'int':   return parseInt(cellRaw(cell)) || 0;
    case 'bool':  return isYes(cellRaw(cell));
    case 'date':  return cellISO(cell);
    case 'etapa': return normalizeEtapa(cellTxt(cell));
    case 'json':  { const t = cellTxt(cell); if (!t) return []; try { const a = JSON.parse(t); return Array.isArray(a) ? a : []; } catch { return []; } }
    default:      return cellTxt(cell);
  }
}
const igual = (a,b) => JSON.stringify(a) === JSON.stringify(b);

function esLocal(estado){ const e = String(estado||'').toLowerCase(); return !!e && ESTADOS_LOCALES.some(x => e.includes(x.toLowerCase())); }
function esTest(nombre){ const n = String(nombre||'').toLowerCase(); return TEST_NAMES.some(t => n.includes(t)); }

// Convierte las filas del Sheet en LEADS + ST, respetando cambios pendientes.
function procesarFilas(rows) {
  const leads = [];
  const ahora = Date.now();
  rows.slice(1).forEach((row, i) => {
    const c = row.c || [];
    const nombre = cellTxt(c[1]);
    const nl = nombre.toLowerCase();
    if (!nombre || nl === 'nombre' || nl === 'name') return;
    const f = cellFecha(c[0]);
    const perfilRaw = cellTxt(c[3]).toUpperCase().trim();
    const estado = cellTxt(c[11]);
    const l = {
      id: i, nombre, telefono: String(cellRaw(c[2])).replace(/\.0$/,'').trim(),
      perfil: ['S','A','B','C'].includes(perfilRaw.charAt(0)) ? perfilRaw.charAt(0) : (perfilRaw ? '—' : 'C'),
      modelo: cellTxt(c[4]), otros: cellTxt(c[5]), ingreso: cellTxt(c[6]), enganche: cellTxt(c[7]),
      historial: cellTxt(c[8]), mensualidad: cellTxt(c[9]),
      estado: (estado && estado !== 'No indicado') ? estado : '',
      dt: f ? f.d : null, conHora: f ? f.t : false,
    };
    l.local = esLocal(l.estado);
    l.test  = esTest(nombre);
    l.mes   = mesKey(l.dt);
    l.hora  = l.conHora ? l.dt.getHours() : null;
    l.dow   = l.dt ? l.dt.getDay() : null;
    l.modeloCorto = (l.modelo || '').replace(/^Geely\s+/i,'').split(' ').slice(0,2).join(' ') || '—';

    const st = {};
    CAMPOS.forEach(([k, col, tipo]) => { st[k] = normCampo(tipo, c[col]); });
    // Cambios propios que el Sheet todavía no refleja (los envíos tardan unos segundos)
    const p = PEND[i];
    if (p) {
      Object.keys(p).forEach(k => {
        if (igual(st[k], p[k].v) || ahora - p[k].t > 10*60*1000) delete p[k];
        else st[k] = p[k].v;
      });
      if (!Object.keys(p).length) delete PEND[i];
    }
    // Historial que antes solo vivía en el navegador → se conserva y se subirá en la siguiente edición
    if (!st.bitacora.length) {
      try {
        const old = JSON.parse(localStorage.getItem('crm_' + i) || 'null');
        if (old && Array.isArray(old.history) && old.history.length) {
          st.bitacora = old.history.slice(0,30).map(h => ({t:h.time||'', u:'', x:h.text||'', k:'o'}));
        }
      } catch {}
    }
    ST[i] = st;
    leads.push(l);
  });
  guardarPend();
  LEADS = leads;
  BYID = Object.fromEntries(leads.map(l => [l.id, l]));
}

async function gviz(sheet) {
  const r = await api({tipo:'leer', sesion: SESION, hoja: sheet});
  if (!r.ok) {
    if (r.error === 'sesion') sesionVencida();
    throw new Error('No se pudo leer "' + sheet + '" (' + (r.error || 'error') + ')');
  }
  return r.rows || [];
}

function setSync(state, text){ $('sync-dot').className = 'dot' + (state==='busy'?' busy':state==='err'?' err':''); $('sync-text').textContent = text; }

async function syncData() {
  setSync('busy','Actualizando…');
  try {
    const rows = await gviz(SHEET_NAME);
    procesarFilas(rows);
    ULTIMA_SYNC = new Date();
    guardarCache();
    setSync('ok', `${pad(ULTIMA_SYNC.getHours())}:${pad(ULTIMA_SYNC.getMinutes())} · ${LEADS.length} leads`);
    dbg(`Sync OK: ${LEADS.length} leads`, 'ok');
  } catch (e) {
    dbg('Error de sync: ' + e.message, 'err');
    if (!LEADS.length) cargarCache();
    setSync('err', LEADS.length ? 'Sin conexión · datos guardados' : 'No se pudo cargar');
  }
  render();
}

// Copia local para abrir rápido y trabajar sin señal
function guardarCache(){
  try {
    const slim = LEADS.map(l => ({...l, dt: l.dt ? l.dt.getTime() : null}));
    localStorage.setItem('crm2_cache', JSON.stringify({t:Date.now(), leads:slim, st:ST}));
  } catch (e) { dbg('Cache no guardada: ' + e.message, 'warn'); }
}
function cargarCache(){
  try {
    const c = JSON.parse(localStorage.getItem('crm2_cache') || 'null');
    if (!c) return false;
    LEADS = c.leads.map(l => ({...l, dt: l.dt ? new Date(l.dt) : null}));
    BYID = Object.fromEntries(LEADS.map(l => [l.id, l]));
    ST = c.st || {};
    return true;
  } catch { return false; }
}

// ══════════════════════════════════════════════════════════════
// GUARDAR — manda SOLO los campos que cambiaron (nunca pisa el origen del lead)
// ══════════════════════════════════════════════════════════════
function enviar(payload){
  try {
    const ok = navigator.sendBeacon(SCRIPT_URL, new Blob([JSON.stringify({...payload, ...(typeof LINK_AUTH !== 'undefined' && LINK_AUTH ? {link: LINK_AUTH} : {sesion: SESION})})], {type:'text/plain'}));
    dbg(`Enviado ${Object.keys(payload).join(', ')} → ${ok?'ok':'falló'}`, ok?'ok':'err');
    if (!ok) toast('No se pudo enviar el cambio. Revisa tu conexión.');
    return ok;
  } catch (e) { dbg('Error al enviar: '+e.message,'err'); return false; }
}

// guardar(id, {campo: valor, ...}, {log:'texto', k:'c', extra:{...}})
function guardar(id, cambios, opt={}) {
  const st = ST[id] || (ST[id] = vacio());
  if (opt.log) {
    st.bitacora = [{t: isoHora(new Date()), u: currentUser ? currentUser.user : '', x: opt.log, k: opt.k || 'n'}, ...(st.bitacora || [])].slice(0, 40);
    cambios.bitacora = st.bitacora;
  }
  const payload = {rowIndex: id};
  PEND[id] = PEND[id] || {};
  Object.entries(cambios).forEach(([k, v]) => {
    st[k] = v;
    PEND[id][k] = {v, t: Date.now()};
    const tipo = CAMPO_TIPO[k];
    let out = v;
    if (tipo === 'bool') out = v ? 1 : '';
    if (tipo === 'json') out = JSON.stringify(v);
    payload[CAMPO_KEY[k] || k] = out;
  });
  if (opt.extra) Object.assign(payload, opt.extra);
  guardarPend();
  enviar(payload);
  guardarCache();
  programarRender();
}

let _rt = null;
function programarRender(){ clearTimeout(_rt); _rt = setTimeout(render, 60); }

<script>
// ══════════════════════════════════════════════════════════════
// LÓGICA DE CADA LEAD
// ══════════════════════════════════════════════════════════════
const etapa   = l => S(l).etapa || 'nuevo';
const activo  = l => !['cerrado','perdido'].includes(etapa(l));
const asesorDe = l => USERS.find(u => u.user === S(l).asignado);
const nombreAsesor = user => (USERS.find(u => u.user === user) || {}).nombre || user || '';
const contactos = l => { const s = S(l); return (s.llamadasRealizadas||0) + (s.mensajesSeguimiento||0) + (s.videollamadasRealizadas||0); };
// ¿Hubo contacto real (no solo intentos)?
const contactado = l => etapa(l) !== 'nuevo' || contactos(l) > 0;
// ¿Alguien ya intentó algo?
const tocado = l => contactado(l) || (S(l).intentos||0) > 0 || !!S(l).primerContacto;
function ultimoToque(l){ const s = S(l); return fromISO(s.ultimoContacto) || fromISO(s.primerContacto) || null; }
function refAsignacion(l){ const a = fromISO(S(l).fechaAsignacion); return (a && l.dt && a > l.dt) ? a : (l.dt || a); }

function siguientePaso(l) {
  const s = S(l);
  const d = fromISO(s.taskDate);
  if (!d) return null;
  const conHora = hasTime(s.taskDate);
  let estado;
  if (conHora) estado = d < new Date() ? (mismoDia(d,new Date()) ? 'hoy' : 'vencido') : (mismoDia(d,new Date()) ? 'hoy' : 'futuro');
  else estado = d < hoy0() ? 'vencido' : (mismoDia(d,new Date()) ? 'hoy' : 'futuro');
  return {d, texto: s.taskText || 'Seguimiento', estado, iso: s.taskDate};
}
function citaInfo(l){
  const d = fromISO(S(l).citaAgenciaFecha); if (!d) return null;
  const dd = -diasDesde(d);
  return {d, dd, iso: S(l).citaAgenciaFecha};
}

// Hasta dónde ha llegado el lead en el ciclo (para el carril y el embudo)
function nivelCiclo(l){
  const e = etapa(l);
  if (e !== 'perdido') return ETAPA_IDX[e];
  // perdido: inferimos hasta dónde llegó por lo registrado
  const s = S(l); let n = 0;
  if (contactos(l) > 0) n = 1;
  if (s.videollamadasAgendadas > 0 || s.asistioReunion === 'Sí') n = 2;
  if (s.creditoEstado === 'en_proceso' || s.creditoEstado === 'aprobada' || s.docINE) n = Math.max(n,3);
  if (s.citaAgenciaAgendada > 0) n = 4;
  return n;
}
function laneHTML(l){
  const e = etapa(l), n = nivelCiclo(l);
  const cls = e === 'cerrado' ? 'won' : e === 'perdido' ? 'lost' : '';
  return `<span class="lane ${cls}" data-tip="${esc(ETAPAS[ETAPA_IDX[e]].label)}${e==='perdido'&&S(l).motivoPerdida?' · '+esc(S(l).motivoPerdida):''}">${CICLO.map((_,i)=>`<i class="${i<=n?'on':''}${e==='perdido'&&i===n+1?' cut':''}"></i>`).join('')}</span>`;
}
const pfHTML = p => `<span class="pf pf-${['S','A','B','C'].includes(p)?p:'x'}" title="Perfil ${esc(p)}">${esc(p)}</span>`;
function telHTML(l){ const tc = S(l).telefonoConsistente; return tc==='No' ? `<span class="chip bad" data-tip="El teléfono del inicio del test no coincide con el del final">Tel. sin verificar</span>` : ''; }
function origenTexto(l){
  const s = S(l);
  if (s.origen) return redNombre(s.origen.toLowerCase()) + (s.contenido ? ` · ${s.contenido}` : '');
  if (s.fuenteContacto === 'Asesoría Personalizada') return 'Landing Asesoría';
  return '';
}
function telLimpio(l){ const t = String(l.telefono||'').replace(/\D/g,''); return t.length === 10 ? '52'+t : t; }

// ══════════════════════════════════════════════════════════════
// VISIBILIDAD POR ROL
// ══════════════════════════════════════════════════════════════
const esAdmin = () => currentUser && currentUser.role === 'admin';
const esAsesor = () => currentUser && currentUser.role === 'asesor';
const esContenido = () => currentUser && currentUser.role === 'contenido';
function misLeads(){
  if (!currentUser) return [];
  if (esAsesor()) return LEADS.filter(l => S(l).asignado === currentUser.user);
  return LEADS;
}
const asesores = () => USERS.filter(u => u.role === 'asesor');

// ══════════════════════════════════════════════════════════════
// COLA DE "HOY" — qué hacer ahora, en orden
// ══════════════════════════════════════════════════════════════
const COLA = {
  primer:  {t:'Primer contacto',        d:'Les llegó el lead y nadie lo ha tocado. Entre más rápido, más probable que conteste.'},
  vencido: {t:'Pasos vencidos',         d:'Quedaste en hacer algo y ya pasó la fecha.'},
  cita:    {t:'Citas en agencia',       d:'Confirma un día antes y el mismo día.'},
  hoy:     {t:'Para hoy',               d:'Lo que agendaste para hoy.'},
  frio:    {t:'Se están enfriando',     d:`Más de ${DIAS_ENFRIANDO} días sin contacto.`},
  sinplan: {t:'Sin siguiente paso',     d:'Ya hablaste con ellos pero no hay nada agendado.'},
};
function clasificar(l){
  if (!activo(l) || l.test) return null;
  const s = S(l);
  const sp = siguientePaso(l);
  const cita = citaInfo(l);
  if (etapa(l) === 'nuevo' && !tocado(l)) {
    const h = horasDesde(refAsignacion(l));
    return {k:'primer', why: s.asignado ? `Asignado ${hace(refAsignacion(l))}` : `Llegó ${hace(l.dt)}`, h};
  }
  if (sp && sp.estado === 'vencido') return {k:'vencido', why: `${sp.texto} — era ${cuando(sp.iso)}`};
  if (cita && cita.dd >= 0 && cita.dd <= 1) return {k:'cita', why: `Cita ${cuando(cita.iso)}`};
  if (sp && sp.estado === 'hoy') return {k:'hoy', why: `${sp.texto} — ${cuando(sp.iso)}`};
  const ut = ultimoToque(l);
  const dias = ut ? diasDesde(ut) : diasDesde(l.dt);
  if (contactado(l) && dias > DIAS_ENFRIANDO && !(sp && sp.estado === 'futuro')) return {k:'frio', why: `Último contacto ${hace(ut || l.dt)}`};
  if (!sp) return {k:'sinplan', why: 'Define qué sigue y cuándo'};
  return null;
}
function colaDe(leads){
  const grupos = {primer:[],vencido:[],cita:[],hoy:[],frio:[],sinplan:[]};
  leads.forEach(l => { const c = clasificar(l); if (c) grupos[c.k].push({l, ...c}); });
  grupos.primer.sort((a,b) => (a.h??1e9) - (b.h??1e9));
  grupos.vencido.sort((a,b) => (siguientePaso(a.l)?.d||0) - (siguientePaso(b.l)?.d||0));
  grupos.cita.sort((a,b) => citaInfo(a.l).d - citaInfo(b.l).d);
  grupos.frio.sort((a,b) => (ultimoToque(a.l)||a.l.dt||0) - (ultimoToque(b.l)||b.l.dt||0));
  return grupos;
}

// ══════════════════════════════════════════════════════════════
// ESTADÍSTICAS DE EQUIPO (Equipo y Ranking)
// ══════════════════════════════════════════════════════════════
function mediana(arr){ if (!arr.length) return null; const a = [...arr].sort((x,y)=>x-y); const m = Math.floor(a.length/2); return a.length%2 ? a[m] : (a[m-1]+a[m])/2; }
function tiempoPrimerContacto(l){
  const pc = fromISO(S(l).primerContacto); const ref = refAsignacion(l);
  if (!pc || !ref) return null;
  return Math.max(0, (pc - ref) / 3600000);
}
function computeTeamStats(){
  const hace7 = addDias(new Date(), -7);
  const mesAct = mesKey(new Date());

      const lim = (k === 'frio' || k === 'sinplan') ? 8 : 30;
      html += `<div class="q-group">
        <div class="q-title"><span class="h2">${COLA[k].t}</span><span class="badge soft">${g[k].length}</span><span class="hint" style="margin-left:4px">${COLA[k].d}</span></div>
        <div class="q-list">${g[k].slice(0,lim).map(qRow).join('')}</div>
        ${g[k].length > lim ? `<button class="btn btn-sm btn-ghost" style="margin-top:6px" onclick="irLeads({cola:'${k}'})">Ver los ${g[k].length}</button>` : ''}
      </div>`;
    });
  } else if (esAsesor()) {
    html += `<div class="block"><div class="empty"><b>Todo al día</b>Cuando te asignen un lead aparecerá aquí primero.</div></div>`;
  }

  // ── Tareas ──
  const mias = esAdmin() ? allTareas : allTareas.filter(t => t.asignadoA === currentUser.user);
  const filtroA = esAdmin() ? (window._filtroTareas || '') : '';
  let lista = filtroA ? mias.filter(t => t.asignadoA === filtroA) : mias;
  lista = [...lista].sort((a,b) => (a.completada - b.completada) || (a.fechaLimite||'9999').localeCompare(b.fechaLimite||'9999'));
  const pendientes = lista.filter(t => !t.completada);
  const visibles = verTodasTareas ? lista : pendientes;
  html += `<div class="q-group" style="margin-top:30px">
    <div class="h2-row"><div class="h2">Tareas ${esAdmin()?'del equipo':''}</div><span class="hint">${plural(pendientes.length,'pendiente')}</span></div>
    <div class="block" style="padding:14px;margin-bottom:10px">
      <div class="task-form ${esAdmin()?'admin':''}">
        ${esAdmin() ? `<select class="inp" id="tarea-asignado" aria-label="Asignar a">${[currentUser,...asesores()].map(u=>`<option value="${u.user}">${u.user===currentUser.user?'Para mí':esc(u.nombre)}</option>`).join('')}</select>` : ''}
        <input class="inp" id="tarea-texto" placeholder="¿Qué hay que hacer?" onkeydown="if(event.key==='Enter')crearTarea()">
        <input class="inp" id="tarea-fecha" type="datetime-local" aria-label="Fecha límite">
        <button class="btn btn-primary" onclick="crearTarea()">Agregar</button>
      </div>
    </div>
    ${esAdmin() ? `<div class="toolbar"><select class="inp" onchange="window._filtroTareas=this.value;render()" aria-label="Filtrar por persona"><option value="">Todas las personas</option>${[currentUser,...asesores()].map(u=>`<option value="${u.user}" ${filtroA===u.user?'selected':''}>${esc(u.nombre)}</option>`).join('')}</select></div>` : ''}
    <div class="q-list">${visibles.map(t => {
      const est = tareaEstado(t);
      return `<div class="task-row ${t.completada?'done':''}">
        <button class="check ${t.completada?'on':''}" onclick="toggleTarea('${esc(t.id)}')" aria-label="${t.completada?'Marcar pendiente':'Marcar hecha'}">✓</button>
        <div style="flex:1;min-width:0"><div class="t-text">${esc(t.texto)}</div>
        <div class="t-meta ${est==='vencida'?'late':''}">${esAdmin()?esc(nombreAsesor(t.asignadoA))+' · ':''}${t.fechaLimite?(est==='vencida'?'Vencida: ':'')+cuando(t.fechaLimite):'Sin fecha'}${t.asignadoPor && t.asignadoPor!==currentUser.nombre?' · de '+esc(t.asignadoPor):''}</div></div>
      </div>`;
    }).join('') || `<div class="empty">Sin tareas pendientes.</div>`}</div>
    ${lista.length > pendientes.length ? `<button class="btn btn-sm btn-ghost" style="margin-top:6px" onclick="verTodasTareas=!verTodasTareas;render()">${verTodasTareas?'Ocultar hechas':'Ver también las hechas'}</button>` : ''}
  </div>`;
  el.innerHTML = html;
}
</script>
<script>
// ══════════════════════════════════════════════════════════════
// PANTALLA: LEADS
// ══════════════════════════════════════════════════════════════
const LF0 = () => ({q:'', zona: 'local', etapa:'', perfil:'', asesor:'', origen:'', sinAsignar:false, asesoria:false, sinPlan:false, test:false, cola:'', vista:'lista', orden:'reciente', limite:60});
let LF = LF0();
let SEL = new Set();
let leadsShell = '';

function irLeads(opts){ const v = LF.vista; LF = {...LF0(), vista:v, ...opts}; if (opts && (opts.sinAsignar || opts.cola)) LF.vista = 'lista'; SEL.clear(); leadsShell=''; ir('leads'); }
function setLF(k, v){ LF[k] = v; LF.limite = 60; if (k !== 'q') leadsShell = ''; render(); }

function filtrarLeads(){
  let base = misLeads();
  const q = LF.q.trim().toLowerCase();
  const colaSet = LF.cola ? new Set(colaDe(base)[LF.cola].map(x => x.l.id)) : null;
  return base.filter(l => {
    const s = S(l);
    if (!LF.test && l.test) return false;
    if (esAdmin() || esContenido()) {
      if (LF.zona === 'local' && !l.local) return false;
      if (LF.zona === 'fuera' && l.local) return false;
    }
    if (colaSet && !colaSet.has(l.id)) return false;
    if (LF.etapa && etapa(l) !== LF.etapa) return false;
    if (LF.perfil && l.perfil !== LF.perfil) return false;
    if (LF.asesor) { if (LF.asesor === '__none') { if (s.asignado) return false; } else if (s.asignado !== LF.asesor) return false; }
    if (LF.origen) { const o = (s.origen || (s.fuenteContacto==='Asesoría Personalizada'?'landing':'sin etiqueta')).toLowerCase(); if (o !== LF.origen) return false; }
    if (LF.sinAsignar && (s.asignado || !activo(l))) return false;
    if (LF.asesoria && s.fuenteContacto !== 'Asesoría Personalizada') return false;
    if (LF.sinPlan && (!activo(l) || siguientePaso(l))) return false;
    if (q) {
      const hay = (l.nombre + ' ' + l.telefono + ' ' + l.modelo + ' ' + l.estado + ' ' + (s.contenido||'')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}
function ordenar(arr){
  if (LF.orden === 'reciente') return arr.sort((a,b) => (b.dt||0) - (a.dt||0));
  if (LF.orden === 'paso') return arr.sort((a,b) => { const x = siguientePaso(a), y = siguientePaso(b); return (x?x.d:8.64e15) - (y?y.d:8.64e15); });
  if (LF.orden === 'perfil') { const o = {S:0,A:1,B:2,C:3}; return arr.sort((a,b) => (o[a.perfil]??4) - (o[b.perfil]??4) || (b.dt||0)-(a.dt||0)); }
  return arr;
}

function renderLeads(){
  const el = $('s-leads');
  const admin = esAdmin();
  setTitulo(admin ? 'Leads' : 'Mis leads', admin ? 'Todos los prospectos del sistema' : 'Los prospectos que tienes asignados',
    `<div class="seg" role="tablist"><button class="${LF.vista==='lista'?'on':''}" onclick="setLF('vista','lista')">Lista</button><button class="${LF.vista==='etapas'?'on':''}" onclick="setLF('vista','etapas')">Por etapa</button></div>`);

  const shellKey = JSON.stringify({...LF, q:'', limite:0}) + currentUser.user + LEADS.length;
  if (leadsShell !== shellKey || !$('leads-results')) {
    leadsShell = shellKey;
    const origenes = [...new Set(LEADS.map(l => (S(l).origen || '').toLowerCase()).filter(Boolean))].sort();
    const chip = (k, label, tip) => `<button class="fchip ${LF[k]?'on':''}" onclick="setLF('${k}',${!LF[k]})" ${tip?`data-tip="${esc(tip)}"`:''}>${label}</button>`;
    el.innerHTML = `
      <div class="toolbar">
        <div class="search">${IC.search}<input class="inp" id="lead-q" placeholder="Buscar nombre, teléfono, modelo…" value="${esc(LF.q)}" oninput="LF.q=this.value;LF.limite=60;renderLeadsResults()" aria-label="Buscar"></div>
        ${admin||esContenido() ? `<div class="seg"><button class="${LF.zona==='local'?'on':''}" onclick="setLF('zona','local')">Zona local</button><button class="${LF.zona==='fuera'?'on':''}" onclick="setLF('zona','fuera')">Fuera</button><button class="${LF.zona==='todas'?'on':''}" onclick="setLF('zona','todas')">Todas</button></div>` : ''}
        <select class="inp" onchange="setLF('etapa',this.value)" aria-label="Etapa"><option value="">Todas las etapas</option>${ETAPAS.map(e=>`<option value="${e.id}" ${LF.etapa===e.id?'selected':''}>${e.label}</option>`).join('')}</select>
        <select class="inp" onchange="setLF('perfil',this.value)" aria-label="Perfil"><option value="">Todo perfil</option>${['S','A','B','C'].map(p=>`<option ${LF.perfil===p?'selected':''}>${p}</option>`).join('')}</select>
        ${admin ? `<select class="inp" onchange="setLF('asesor',this.value)" aria-label="Asesor"><option value="">Todos los asesores</option><option value="__none" ${LF.asesor==='__none'?'selected':''}>Sin asignar</option>${asesores().map(u=>`<option value="${u.user}" ${LF.asesor===u.user?'selected':''}>${esc(u.nombre)}</option>`).join('')}</select>` : ''}
        ${admin && origenes.length ? `<select class="inp" onchange="setLF('origen',this.value)" aria-label="Origen"><option value="">Todo origen</option>${origenes.map(o=>`<option value="${esc(o)}" ${LF.origen===o?'selected':''}>${esc(o)}</option>`).join('')}<option value="landing" ${LF.origen==='landing'?'selected':''}>landing</option><option value="sin etiqueta" ${LF.origen==='sin etiqueta'?'selected':''}>sin etiqueta</option></select>` : ''}
      </div>
      <div class="filters">
        ${admin ? chip('sinAsignar','Sin asignar') : ''}
        ${chip('asesoria','Pidió asesoría','Llegaron desde la landing de Asesoría Personalizada')}
        ${chip('sinPlan','Sin siguiente paso','Activos sin nada agendado')}
        ${LF.cola ? `<button class="fchip on" onclick="setLF('cola','')">${COLA[LF.cola].t} ✕</button>` : ''}
        ${admin ? chip('test','Incluir pruebas') : ''}
        <select class="inp" style="height:32px;width:auto;font-size:13px;padding:0 30px 0 12px;border-radius:999px;margin-left:auto" onchange="setLF('orden',this.value)" aria-label="Ordenar"><option value="reciente" ${LF.orden==='reciente'?'selected':''}>Más recientes</option><option value="paso" ${LF.orden==='paso'?'selected':''}>Próximo paso</option><option value="perfil" ${LF.orden==='perfil'?'selected':''}>Mejor perfil</option></select>
      </div>
      <div id="leads-results"></div>`;
  }
  renderLeadsResults();
}

function renderLeadsResults(){
  const box = $('leads-results'); if (!box) return;
  const arr = ordenar(filtrarLeads());
  const admin = esAdmin();
  const resumen = `<div class="result-line"><span>${plural(arr.length,'lead')}${LF.zona==='local'&&admin?' en zona local':''}</span>${(LF.q||LF.etapa||LF.perfil||LF.asesor||LF.origen||LF.sinAsignar||LF.asesoria||LF.sinPlan||LF.cola)?`<button class="btn btn-sm btn-ghost" onclick="LF={...LF0(),vista:LF.vista};leadsShell='';render()">Quitar filtros</button>`:''}</div>`;
  const bulk = admin && SEL.size ? `<div class="bulk"><b>${plural(SEL.size,'seleccionado')}</b>
    <select class="inp" id="bulk-asesor" aria-label="Asesor"><option value="">Asignar a…</option>${asesores().map(u=>`<option value="${u.user}">${esc(u.nombre)} (${LEADS.filter(l=>S(l).asignado===u.user&&activo(l)).length} activos)</option>`).join('')}</select>
    <button class="btn btn-sm btn-primary" onclick="bulkAsignar()">Asignar y avisar por WhatsApp</button>
    <button class="btn btn-sm btn-ghost" onclick="SEL.clear();renderLeadsResults()">Cancelar</button></div>` : '';

  if (!arr.length) { box.innerHTML = resumen + `<div class="block"><div class="empty"><b>No hay leads con estos filtros</b>${LF.sinAsignar?'Todos los leads locales activos ya tienen asesor.':'Prueba quitando algún filtro.'}</div></div>`; return; }

  if (LF.vista === 'etapas') {
    box.innerHTML = resumen + `<div class="board">${ETAPAS.map(e => {
      const cards = arr.filter(l => etapa(l) === e.id);
      const lim = 40;
      return `<div class="col"><div class="col-h"><span><i style="background:${e.color}"></i>${e.label}</span><span class="hint num">${cards.length}</span></div>
        <div class="col-b">${cards.slice(0,lim).map(l => {
          const sp = siguientePaso(l);
          return `<div class="kcard" onclick="openFicha(${l.id})">
            <div class="kc-name">${pfHTML(l.perfil)}<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.nombre)}</span></div>
            <div class="kc-meta">${esc(l.modeloCorto)} · ${hace(l.dt)}${admin?` · ${S(l).asignado?esc(nombreAsesor(S(l).asignado)):'<span class="soon">sin asignar</span>'}`:''}</div>
            ${sp ? `<div class="kc-next ${sp.estado==='vencido'?'late':sp.estado==='hoy'?'soon':''}">${esc(sp.texto)} · ${cuando(sp.iso)}</div>` : (activo(l)&&e.id!=='nuevo'?`<div class="kc-next late">Sin siguiente paso</div>`:'')}
          </div>`;
        }).join('') || '<div class="empty" style="padding:14px">—</div>'}
        ${cards.length > lim ? `<button class="btn btn-sm btn-ghost" onclick="LF.etapa='${e.id}';LF.vista='lista';leadsShell='';render()">Ver los ${cards.length}</button>` : ''}</div></div>`;
    }).join('')}</div>`;
    return;
  }

  const page = arr.slice(0, LF.limite);
  const allSel = admin && page.length && page.every(l => SEL.has(l.id));
  const filaPaso = l => { const sp = siguientePaso(l); if (sp) return `<span class="${sp.estado==='vencido'?'late':sp.estado==='hoy'?'soon':''}">${esc(sp.texto)}</span><div class="cell-sub">${cuando(sp.iso)}</div>`; return activo(l) && etapa(l)!=='nuevo' ? '<span class="late">Sin siguiente paso</span>' : '<span class="hint">—</span>'; };
  const filaAsesor = l => { const s = S(l); if (s.asignado) return esc(nombreAsesor(s.asignado)); return l.local ? '<span class="soon">Sin asignar</span>' : '<span class="hint">Fuera de zona</span>'; };
  const sub = l => [esc(l.modeloCorto), esc(origenTexto(l))].filter(Boolean).join(' · ');

  box.innerHTML = resumen + bulk + `
    <div class="tbl-wrap tbl-desk"><table class="tbl"><thead><tr>
      ${admin ? `<th style="width:36px"><input type="checkbox" ${allSel?'checked':''} onchange="selPagina(this.checked)" aria-label="Seleccionar página"></th>` : ''}
      <th>Prospecto</th><th class="c">Perfil</th><th>Estado</th><th>Ciclo</th>${admin?'<th>Asesor</th>':''}<th>Siguiente paso</th><th>Llegó</th>
    </tr></thead><tbody>
      ${page.map(l => `<tr onclick="openFicha(${l.id})">
        ${admin ? `<td onclick="event.stopPropagation()"><input type="checkbox" ${SEL.has(l.id)?'checked':''} onchange="selUno(${l.id},this.checked)" aria-label="Seleccionar ${esc(l.nombre)}"></td>` : ''}
        <td><div class="cell-name">${esc(l.nombre)}${l.test?' <span class="chip">prueba</span>':''}${S(l).fuenteContacto==='Asesoría Personalizada'?' <span class="chip brand">pidió asesoría</span>':''}${telHTML(l)}</div><div class="cell-sub">${sub(l)}</div></td>
        <td class="c">${pfHTML(l.perfil)}</td>
        <td class="${l.local?'zone-l':'zone-f'}">${esc(l.estado||'—')}</td>
        <td>${laneHTML(l)}<div class="cell-sub">${ETAPAS[ETAPA_IDX[etapa(l)]].label}</div></td>
        ${admin ? `<td>${filaAsesor(l)}</td>` : ''}
        <td>${filaPaso(l)}</td>
        <td class="num" style="white-space:nowrap;color:var(--ink-2)">${hace(l.dt)}</td>
      </tr>`).join('')}
    </tbody></table></div>
    <div class="cards-m">${page.map(l => { const sp = siguientePaso(l); return `<div class="lead-card" onclick="openFicha(${l.id})">
      <div class="lc-top">${admin?`<input type="checkbox" ${SEL.has(l.id)?'checked':''} onclick="event.stopPropagation()" onchange="selUno(${l.id},this.checked)" aria-label="Seleccionar">`:''}${pfHTML(l.perfil)}<span class="lc-name">${esc(l.nombre)}</span><span class="hint">${hace(l.dt)}</span></div>
      <div class="lc-mid"><span>${sub(l)}${admin?` · ${filaAsesor(l)}`:''}</span>${laneHTML(l)}</div>
      <div class="lc-mid" style="margin-top:4px">${sp?`<span class="${sp.estado==='vencido'?'late':sp.estado==='hoy'?'soon':''}">${esc(sp.texto)} · ${cuando(sp.iso)}</span>`:`<span class="hint">${ETAPAS[ETAPA_IDX[etapa(l)]].label}</span>`}</div>
    </div>`; }).join('')}</div>
    ${arr.length > LF.limite ? `<div class="more"><button class="btn" onclick="LF.limite+=100;renderLeadsResults()">Mostrar más (${arr.length - LF.limite} restantes)</button></div>` : ''}`;
}
function selUno(id, on){ on ? SEL.add(id) : SEL.delete(id); renderLeadsResults(); }
function selPagina(on){ ordenar(filtrarLeads()).slice(0, LF.limite).forEach(l => on ? SEL.add(l.id) : SEL.delete(l.id)); renderLeadsResults(); }

// Asignación (individual y en masa) — avisa al asesor por WhatsApp y por correo (Apps Script)
function asignar(id, user, enMasa){
  const l = BYID[id]; const s = S(l);
  const antes = s.asignado || '';
  if (antes === (user||'')) return false;
  const cambios = {asignado: user || ''};
  if (user) cambios.fechaAsignacion = isoHora(new Date());
  guardar(id, cambios, {log:`Asignado: ${antes?nombreAsesor(antes):'sin asignar'} → ${user?nombreAsesor(user):'sin asignar'}${enMasa?' (en grupo)':''}`, k:'a',
    extra:{notificarAsignacion: !!user, leadNombre:l.nombre, leadModelo:l.modelo, leadTelefono:l.telefono, leadPerfil:l.perfil}});
  return true;
}
async function avisarAsesorWA(user, leads){
  const u = USERS.find(x => x.user === user);
  if (!u || !u.whatsapp || !leads.length) return;
  // La ventana se abre en el momento del clic (si no, el navegador la bloquea) y luego se llena con el mensaje.
  let w = null; try { w = window.open('', '_blank'); } catch {}
  let claves = [];
  try { claves = await clavesLinks(leads.map(l => l.id), user); } catch {}
  const conLinks = claves.some(Boolean);
  const lineas = leads.map((l, i) => `• ${l.nombre} — ${l.modeloCorto} (perfil ${l.perfil}) · ${l.telefono}${claves[i] ? '\n  ' + urlLink(l.id, claves[i]) : ''}`);
  const cierre = conLinks
    ? (leads.length === 1 ? 'Cuando le escribas, abre el link y marca qué pasó (es un toque, sin contraseña).' : 'Cuando les escribas, abre el link de cada uno y marca qué pasó (es un toque, sin contraseña).')
    : (leads.length === 1 ? 'Ya está en tu sección Hoy del CRM.' : 'Ya están en tu sección Hoy del CRM.');
  const msg = leads.length === 1
    ? `Hola ${firstName(u.nombre)}, te asigné un lead nuevo:\n\n${lineas[0]}\n\nEntre más rápido el primer contacto, mejor. ${cierre}`
    : `Hola ${firstName(u.nombre)}, te asigné ${leads.length} leads nuevos:\n\n${lineas.join('\n')}\n\n${cierre}`;
  const url = `https://wa.me/${u.whatsapp}?text=${encodeURIComponent(msg)}`;
  if (w && !w.closed) w.location.href = url; else window.open(url, '_blank');
}
function bulkAsignar(){
  const user = $('bulk-asesor').value;
  if (!user) { toast('Elige a quién asignar.'); return; }
  const hechos = [];
  SEL.forEach(id => { if (asignar(id, user, true)) hechos.push(BYID[id]); });
  avisarAsesorWA(user, hechos);
  toast(`${plural(hechos.length,'lead')} asignado${hechos.length===1?'':'s'} a ${nombreAsesor(user)}`);
  SEL.clear(); render();
}
</script>
<script>
// ══════════════════════════════════════════════════════════════
// FICHA DEL LEAD
// ══════════════════════════════════════════════════════════════
let fichaId = null, fichaEditando = false, REG = null;

function openFicha(id, conRegistro){
  fichaId = id;
  REG = conRegistro ? nuevoReg(conRegistro === true ? null : conRegistro) : null;
  renderFicha();
  $('ficha-ov').classList.add('open');
  requestAnimationFrame(() => $('ficha').classList.add('open'));
  if (REG) setTimeout(() => $('reg-box')?.scrollIntoView({block:'nearest'}), 250);
}
function closeFicha(){
  $('ficha').classList.remove('open'); $('ficha-ov').classList.remove('open');
  fichaId = null; REG = null; fichaEditando = false;
  render();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('modal-ov').classList.contains('open')) closeModal(); else if (fichaId !== null) closeFicha(); } });

// Después de tocar "Llamar", al volver al CRM se abre el registro de esa llamada
let _trasLlamada = null;
function tras(medio, id){ _trasLlamada = {id, medio, t: Date.now()}; }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && _trasLlamada && Date.now() - _trasLlamada.t > 3000) {
    const p = _trasLlamada; _trasLlamada = null;
    openFicha(p.id, {medio: p.medio});
  }
});

function renderFicha(){
  if (fichaId === null) return;
  const l = BYID[fichaId]; if (!l) return;
  if (REG && $('reg-txt')) { REG.paso = $('reg-txt').value; REG.fecha = $('reg-fecha').value; if ($('reg-cita')) REG.cita = $('reg-cita').value; }
  const s = S(l), e = etapa(l);
  const sp = siguientePaso(l);
  const n = nivelCiclo(l);
  const admin = esAdmin();
  const ase = asesorDe(l);
  const scrollTop = $('ficha').querySelector('.f-body')?.scrollTop || 0;

  const tags = [
    pfHTML(l.perfil),
    `<span class="chip ${l.local?'good':''}">${esc(l.estado || 'Sin estado')}${l.local?'':' · fuera de zona'}</span>`,
    origenTexto(l) ? `<span class="chip brand">${esc(origenTexto(l))}</span>` : '',
    telHTML(l),
    s.telefonoConsistente==='Sí' ? `<span class="chip good" data-tip="El teléfono coincide en ambas veces que lo dio">Tel. verificado</span>` : '',
    `<span class="chip">Llegó ${hace(l.dt)}</span>`,
  ].join('');

  const laneCls = e === 'cerrado' ? 'won' : e === 'perdido' ? 'lost' : '';
  const faltan = DOCS.slice(0,3).filter(d => !s[d.key]).map(d => d.label);

  $('ficha').innerHTML = `

// ── Siguiente paso ──
const PASOS_RAPIDOS = ['Llamar de nuevo','Mandar cotización','Agendar asesoría','Pedir documentos','Dar seguimiento al crédito','Confirmar cita','Seguimiento'];
function fechasRapidas(){
  const d = new Date(); const out = [];
  const t = new Date(d); t.setHours(Math.max(d.getHours()+2, 10), 0, 0, 0);
  if (t.getDate() === d.getDate() && t.getHours() <= 19) out.push(['Hoy ' + (t.getHours()%12||12) + (t.getHours()<12?' a. m.':' p. m.'), isoHora(t)]);
  const m = addDias(d,1); m.setHours(10,0,0,0); out.push(['Mañana 10 a. m.', isoHora(m)]);
  const m2 = addDias(d,2); m2.setHours(10,0,0,0); out.push([`${DIAS[m2.getDay()]} 10 a. m.`, isoHora(m2)]);
  const s = addDias(d,7); s.setHours(10,0,0,0); out.push(['En una semana', isoHora(s)]);
  return out;
}
function pasoFormHTML(prefix, texto, fecha){
  return `<div class="reg-l">¿Qué sigue?</div>
    <div class="quick-dates">${PASOS_RAPIDOS.map(p=>`<button class="opt ${texto===p?'on':''}" onclick="$('${prefix}-txt').value='${p}';this.parentNode.querySelectorAll('.opt').forEach(o=>o.classList.remove('on'));this.classList.add('on')">${p}</button>`).join('')}</div>
    <input class="inp" id="${prefix}-txt" value="${esc(texto||'')}" placeholder="O escríbelo tú">
    <div class="reg-l">¿Cuándo?</div>
    <div class="quick-dates">${fechasRapidas().map(([t,v])=>`<button class="opt" onclick="$('${prefix}-fecha').value='${v}';this.parentNode.querySelectorAll('.opt').forEach(o=>o.classList.remove('on'));this.classList.add('on')">${t}</button>`).join('')}</div>
    <input class="inp" type="datetime-local" id="${prefix}-fecha" value="${esc(fecha||'')}">`;
}

  $('paso-edit').innerHTML = `<div class="reg" style="border-color:var(--line-2)">${pasoFormHTML('pe', s.taskText, hasTime(s.taskDate)?s.taskDate:(s.taskDate?s.taskDate+'T10:00':''))}
